<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f4f4f4; font-weight: bold; }
        .btn-bold { font-weight: bold; padding: 8px 15px; border-radius: 5px; }
    </style>
</head>
<body class="bg-gray-100 p-6">

    <nav class="bg-blue-600 text-white p-4 mb-6 rounded shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold">Manage Case</h1>
        <div class="flex items-center gap-4">
            <span id="user-email" class="font-bold"></span>
            <button onclick="window.location.href='index.html'" class="bg-green-500 text-white btn-bold">Submit New</button>
            <button id="logout-btn" class="bg-red-500 text-white btn-bold">Logout</button>
        </div>
    </nav>

    <div class="overflow-x-auto">
        <h2 class="text-2xl font-bold mb-4">My Submitted Experiences</h2>
        <table>
            <thead>
                <tr>
                    <th>Manage</th>
                    <th>Experience Title</th>
                    <th>City (Nearest City)</th>
                    <th>Dates</th>
                    <th>Categories</th>
                    <th>Organization Name</th>
                    <th>Contact Person</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, where, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2ipuHLEq40P-mkN0NaPvZVDrum4NoIs",
            authDomain: "submit-a.firebaseapp.com",
            projectId: "submit-a",
            storageBucket: "submit-a.firebasestorage.app",
            messagingSenderId: "488916289105",
            appId: "1:488916289105:web:ea80aae58690bd09465a70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').innerText = user.email;
                loadData(user.email);
            } else {
                window.location.href = "index.html";
            }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        function loadData(userEmail) {
            const q = query(collection(db, "retreats"), where("hostEmail", "==", userEmail));
            onSnapshot(q, (snap) => {
                const body = document.getElementById('table-body');
                body.innerHTML = "";
                snap.forEach(d => {
                    const r = d.data();
                    body.innerHTML += `<tr>
                        <td>
                            <button onclick="window.location.href='index.html?editId=${d.id}'" class="text-blue-600 font-bold underline">Edit</button>
                            <button onclick="window.deleteEvent('${d.id}')" class="text-red-600 font-bold underline ml-2">Del</button>
                        </td>
                        <td class="font-bold">${r.retreatName}</td>
                        <td>${r.city}</td>
                        <td>${r.startDate} to ${r.endDate}</td>
                        <td>${(r.categories || []).join(', ')}</td>
                        <td>${r.orgInfo}</td>
                        <td>${r.contactName}</td>
                    </tr>`;
                });
            });
        }

        window.deleteEvent = async (id) => confirm("Delete permanently?") && await deleteDoc(doc(db, "retreats", id));
    </script>
</body>
</html>
