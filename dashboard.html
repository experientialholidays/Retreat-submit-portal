<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registry Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; color: #334155; font-size: 16px; }
        .bg-peach { background-color: #ffeadb; }
        .text-peach-dark { color: #855d48; }
        .table-wrapper { background: white; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
        th { background: #f8fafc; padding: 12px; font-size: 11px; text-transform: uppercase; color: #64748b; border-bottom: 2px solid #edf2f7; white-space: nowrap; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; vertical-align: top; }
        .filter-select { display: block; width: 100%; margin-top: 5px; font-size: 11px; padding: 2px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .btn-edit { color: #0284c7; font-weight: 700; font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #f0f9ff; }
        .btn-delete { color: #dc2626; font-weight: 700; font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #fef2f2; margin-left: 4px; }
        .scroll-cell { max-height: 60px; overflow-y: auto; font-size: 12px; color: #64748b; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-peach text-peach-dark p-4 sticky top-0 z-50 shadow-sm border-b border-[#f5d6c4]">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold uppercase">Registry <span class="opacity-70">Dashboard</span></h1>
            <div id="user-profile" class="hidden flex items-center gap-4">
                <span id="admin-badge" class="hidden bg-orange-400 text-white px-2 py-0.5 rounded text-[10px] font-bold">ADMIN</span>
                <span id="user-email" class="font-medium text-sm border-r border-[#f5d6c4] pr-3"></span>
                <a href="index.html" class="text-sm font-bold bg-white px-3 py-1 rounded border border-[#f5d6c4]">Submit New</a>
                <button id="logout-btn" class="text-[11px] uppercase font-bold opacity-60">Logout</button>
            </div>
        </div>
    </nav>

    <div id="main-content" class="hidden p-4 md:p-8">
        <div class="max-w-[1600px] mx-auto">
            <header class="mb-6"><h2 class="text-2xl font-bold text-slate-800 uppercase">Experience Registry</h2></header>

            <div class="table-wrapper overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[2000px]">
                    <thead>
                        <tr>
                            <th>Actions</th>
                            <th>Title <select class="filter-select" data-col="retreatName"><option value="">All</option></select></th>
                            <th>Host Email <select class="filter-select" data-col="hostEmail"><option value="">All</option></select></th>
                            <th>State <select class="filter-select" data-col="state"><option value="">All</option></select></th>
                            <th>City <select class="filter-select" data-col="city"><option value="">All</option></select></th>
                            <th>Date (Start - End)</th>
                            <th>Categories <select class="filter-select" data-col="categories"><option value="">All</option></select></th>
                            <th>Description</th>
                            <th>Contact Person</th>
                            <th>Media</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="login-prompt" class="max-w-md mx-auto mt-20 p-8 bg-white rounded-xl text-center">
        <button id="login-btn" class="w-full bg-[#ffeadb] text-[#855d48] px-5 py-3 rounded-xl font-bold border border-[#f5d6c4]">Sign In with Google</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2ipuHLEq40P-mkN0NaPvZVDrum4NoIs",
            authDomain: "submit-a.firebaseapp.com",
            projectId: "submit-a",
            storageBucket: "submit-a.firebasestorage.app",
            messagingSenderId: "488916289105",
            appId: "1:488916289105:web:ea80aae58690bd09465a70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let rawData = [];
        let filteredData = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('login-prompt').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;

                // --- SECRET ADMIN CHECK ---
                const adminSnap = await getDoc(doc(db, "admins", user.email.toLowerCase().trim()));
                const isAdmin = adminSnap.exists();
                
                if(isAdmin) document.getElementById('admin-badge').classList.remove('hidden');
                fetchData(user.email, isAdmin);
            } else {
                document.getElementById('login-prompt').classList.remove('hidden');
                document.getElementById('user-profile').classList.add('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        async function fetchData(email, isAdmin) {
            const retreatsRef = collection(db, "retreats");
            const q = isAdmin ? retreatsRef : query(retreatsRef, where("hostEmail", "==", email));
            const snap = await getDocs(q);
            rawData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            filteredData = [...rawData];
            setupFilters();
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                const cats = Array.isArray(row.categories) ? row.categories.join(", ") : row.categories;
                tr.innerHTML = `
                    <td><button onclick="editRow('${row.id}')" class="btn-edit">Edit</button><button onclick="deleteRow('${row.id}')" class="btn-delete">Del</button></td>
                    <td class="font-bold">${row.retreatName}</td>
                    <td class="text-xs">${row.hostEmail}</td>
                    <td>${row.state}</td><td>${row.city}</td>
                    <td class="text-xs">${row.startDate} to ${row.endDate}</td>
                    <td><div class="scroll-cell" style="width:150px">${cats}</div></td>
                    <td><div class="scroll-cell" style="width:250px">${row.description}</div></td>
                    <td>${row.contactName}</td>
                    <td>${(row.fileUrls?.length || 0)} Files</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function setupFilters() {
            document.querySelectorAll('.filter-select').forEach(select => {
                const col = select.getAttribute('data-col');
                const vals = new Set();
                rawData.forEach(item => { if(item[col]) vals.add(item[col]); });
                select.innerHTML = '<option value="">All</option>';
                Array.from(vals).sort().forEach(v => select.innerHTML += `<option value="${v}">${v}</option>`);
                select.onchange = () => {
                    const selects = document.querySelectorAll('.filter-select');
                    filteredData = rawData.filter(item => Array.from(selects).every(s => !s.value || item[s.getAttribute('data-col')] == s.value));
                    renderTable();
                };
            });
        }

        window.editRow = (id) => window.location.href = `index.html?editId=${id}`;
        window.deleteRow = async (id) => confirm("Delete permanently?") && (await deleteDoc(doc(db, "retreats", id)), location.reload());
    </script>
</body>
</html>
