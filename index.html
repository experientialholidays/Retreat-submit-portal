<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retreat Submission Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .form-card { border-top: 10px solid #1e40af; }
        input[type="checkbox"]:checked + label { color: #1e40af; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-20">

    <nav class="bg-white border-b sticky top-0 z-50 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tight text-blue-800 uppercase">Retreat Hub</h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-display-email" class="text-sm font-medium text-slate-500"></span>
                <button id="logout-btn" class="text-xs font-bold text-red-500 uppercase hover:underline">Sign Out</button>
            </div>
            <button id="login-btn" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-700 shadow-md transition">Login</button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 mt-8">
        <div id="login-prompt" class="text-center py-20 bg-white rounded-2xl shadow-sm border">
            <h2 class="text-2xl font-bold mb-2">Welcome to the Retreat Portal</h2>
            <p class="text-slate-500 mb-6">Please sign in to submit your retreats.</p>
        </div>

        <div id="main-app" class="hidden space-y-8">
            <div id="form-container" class="bg-white rounded-xl shadow-lg border form-card p-8">
                <h2 class="text-3xl font-extrabold mb-6">Submit your Retreat</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">Retreat Name *</label>
                        <input type="text" id="retreatName" class="w-full bg-slate-50 border-b-2 border-slate-200 p-3 outline-none focus:border-blue-600 transition">
                    </div>

                    <div>
                        <label class="block font-bold mb-2">State / Union Territory *</label>
                        <select id="state" class="w-full bg-slate-50 border p-3 rounded-lg outline-none">
                            <option value="">Select Location</option>
                            <option>Andaman and Nicobar Islands</option>
                            <option>Andhra Pradesh</option>
                            <option>Arunachal Pradesh</option>
                            <option>Assam</option>
                            <option>Bihar</option>
                            <option>Chandigarh</option>
                            <option>Chhattisgarh</option>
                            <option>Dadra and Nagar Haveli and Daman and Diu</option>
                            <option>Delhi</option>
                            <option>Goa</option>
                            <option>Gujarat</option>
                            <option>Haryana</option>
                            <option>Himachal Pradesh</option>
                            <option>Jammu and Kashmir</option>
                            <option>Jharkhand</option>
                            <option>Karnataka</option>
                            <option>Kerala</option>
                            <option>Ladakh</option>
                            <option>Lakshadweep</option>
                            <option>Madhya Pradesh</option>
                            <option>Maharashtra</option>
                            <option>Manipur</option>
                            <option>Meghalaya</option>
                            <option>Mizoram</option>
                            <option>Nagaland</option>
                            <option>Odisha</option>
                            <option>Puducherry</option>
                            <option>Punjab</option>
                            <option>Rajasthan</option>
                            <option>Sikkim</option>
                            <option>Tamil Nadu</option>
                            <option>Telangana</option>
                            <option>Tripura</option>
                            <option>Uttar Pradesh</option>
                            <option>Uttarakhand</option>
                            <option>West Bengal</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold mb-2">City *</label>
                        <input type="text" id="city" class="w-full bg-slate-50 border p-3 rounded-lg outline-none">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block font-bold mb-3">Categories *</label>
                        <div id="category-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-slate-50 p-4 rounded-xl border"></div>
                        <div id="other-category-container" class="hidden mt-3">
                            <input type="text" id="otherCategoryText" class="w-full bg-white border p-3 rounded-lg outline-none border-blue-200" placeholder="Type custom category...">
                        </div>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">Description *</label>
                        <textarea id="description" rows="3" class="w-full bg-slate-50 border p-3 rounded-lg outline-none"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">Contribution (Inclusions & Exclusions) *</label>
                        <textarea id="contribution" rows="3" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" placeholder="Briefly mention what is included and excluded in the package."></textarea>
                    </div>

                    <div class="md:col-span-2 mt-4 pt-4 border-t">
                        <h3 class="font-bold text-blue-800 mb-4">Photos, Documents & Video</h3>
                    </div>

                    <div class="md:col-span-2 border-2 border-dashed border-slate-200 p-6 rounded-xl text-center bg-slate-50">
                        <label class="block font-bold mb-2">Upload Files (Images, PDF, Video)</label>
                        <input type="file" id="fileUpload" multiple accept="image/*,video/*,.pdf" class="text-sm">
                        <p class="text-[10px] text-slate-400 mt-2 italic">Max 5 files. Max 10MB each.</p>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">YouTube Video Link (Recommended)</label>
                        <input type="url" id="videoLink" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" placeholder="https://www.youtube.com/watch?v=...">
                    </div>

                    <div class="md:col-span-2 mt-4 pt-4 border-t">
                        <h3 class="font-bold text-blue-800 mb-4">Organization & Contact</h3>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">Organization Name & Short Bio *</label>
                        <textarea id="orgInfo" rows="2" class="w-full bg-slate-50 border p-3 rounded-lg outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block font-bold mb-2">Contact Person Name *</label>
                        <input type="text" id="contactName" class="w-full bg-slate-50 border p-3 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold mb-2">Contact Email *</label>
                        <input type="email" id="contactEmail" class="w-full bg-slate-50 border p-3 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold mb-2">WhatsApp Number *</label>
                        <input type="tel" id="contactWhatsApp" class="w-full bg-slate-50 border p-3 rounded-lg">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">Links (Website, Social Media, etc.)</label>
                        <div id="links-container" class="space-y-2">
                            <input type="url" class="link-input w-full bg-slate-50 border p-3 rounded-lg outline-none" placeholder="https://...">
                        </div>
                        <button type="button" onclick="addLinkField()" class="mt-2 text-blue-600 text-sm font-bold hover:underline">+ Add more links</button>
                    </div>
                </div>

                <button id="submit-btn" class="mt-10 w-full bg-blue-800 text-white font-black py-4 rounded-xl shadow-lg hover:bg-blue-900 transition uppercase tracking-widest">Submit Retreat</button>
                <p id="status" class="text-center mt-4 text-sm font-bold text-blue-600"></p>
            </div>

            <div class="mt-12">
                <h3 class="text-2xl font-black mb-6">Your Submissions</h3>
                <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2ipuHLEq40P-mkN0NaPvZVDrum4NoIs",
            authDomain: "submit-a.firebaseapp.com",
            projectId: "submit-a",
            storageBucket: "submit-a.firebasestorage.app",
            messagingSenderId: "488916289105",
            appId: "1:488916289105:web:ea80aae58690bd09465a70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        const categories = ["Wellness & Healing", "Mental Health & Emotional Growth", "Spirituality & Consciousness", "Fitness, Movement & Martial Arts", "Adventure & Outdoor Exploration", "Nature, Sustainability & Eco Living", "Leadership, Business & Career", "Technology & Innovation", "Creativity & Arts", "Relationships & Connection", "Culture, Philosophy & Learning", "Lifestyle & Personal Transformation", "Luxury, Leisure & Travel", "Identity & Belonging", "Other..."];
        const catList = document.getElementById('category-list');
        categories.forEach(cat => {
            catList.innerHTML += `<div class="flex items-center gap-2"><input type="checkbox" name="category" value="${cat}" id="${cat}" onchange="toggleOther(this)" class="w-4 h-4 rounded text-blue-600"><label for="${cat}" class="text-sm text-slate-700">${cat}</label></div>`;
        });

        window.toggleOther = (el) => document.getElementById('other-category-container').classList.toggle('hidden', !(el.value === "Other..." && el.checked));
        
        window.addLinkField = () => {
            const input = document.createElement('input');
            input.type = 'url';
            input.className = 'link-input w-full bg-slate-50 border p-3 rounded-lg outline-none';
            input.placeholder = 'https://...';
            document.getElementById('links-container').appendChild(input);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('login-prompt').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-display-email').innerText = user.email;
                loadData();
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('login-prompt').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        document.getElementById('submit-btn').onclick = async () => {
            const status = document.getElementById('status');
            const files = document.getElementById('fileUpload').files;
            let checkedCats = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(cb => cb.value);
            
            if (checkedCats.includes("Other...")) {
                const otherVal = document.getElementById('otherCategoryText').value;
                if (otherVal) checkedCats.push(otherVal);
                checkedCats = checkedCats.filter(c => c !== "Other...");
            }

            if (files.length > 5) return alert("Max 5 files allowed.");
            status.innerText = "Uploading data...";

            try {
                const fileUrls = [];
                for (let file of files) {
                    if (file.size > 10 * 1024 * 1024) throw new Error(`${file.name} is too large (>10MB).`);
                    const sRef = ref(storage, `retreats/${Date.now()}_${file.name}`);
                    const snap = await uploadBytes(sRef, file);
                    fileUrls.push(await getDownloadURL(snap.ref));
                }

                const links = Array.from(document.querySelectorAll('.link-input')).map(i => i.value).filter(v => v.trim() !== "");

                await addDoc(collection(db, "retreats"), {
                    retreatName: document.getElementById('retreatName').value,
                    state: document.getElementById('state').value,
                    city: document.getElementById('city').value,
                    categories: checkedCats,
                    description: document.getElementById('description').value,
                    contribution: document.getElementById('contribution').value,
                    videoLink: document.getElementById('videoLink').value,
                    orgInfo: document.getElementById('orgInfo').value,
                    contactName: document.getElementById('contactName').value,
                    contactEmail: document.getElementById('contactEmail').value,
                    contactWhatsApp: document.getElementById('contactWhatsApp').value,
                    links: links,
                    fileUrls: fileUrls,
                    userEmail: auth.currentUser.email,
                    timestamp: Date.now()
                });

                status.innerText = "Successfully Submitted!";
                setTimeout(() => location.reload(), 1500);
            } catch (err) {
                status.innerText = "Error: " + err.message;
            }
        };

        function loadData() {
            const q = query(collection(db, "retreats"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = "";
                snapshot.forEach((snap) => {
                    const r = snap.data();
                    if (auth.currentUser.email !== r.userEmail) return;
                    
                    let videoPreview = "";
                    if(r.videoLink && r.videoLink.includes("youtube.com/watch?v=")) {
                        const vidId = r.videoLink.split("v=")[1].split("&")[0];
                        videoPreview = `<iframe class="w-full aspect-video rounded mt-2" src="https://www.youtube.com/embed/${vidId}" frameborder="0"></iframe>`;
                    }

                    gallery.innerHTML += `
                        <div class="bg-white p-6 rounded-xl border shadow-sm">
                            <h4 class="font-bold text-blue-900">${r.retreatName}</h4>
                            <p class="text-[10px] text-slate-400">${r.city}, ${r.state}</p>
                            ${videoPreview}
                            <div class="flex justify-between items-center mt-4 pt-2 border-t">
                                <span class="text-[10px] font-bold text-slate-400 uppercase">${r.fileUrls.length} Attachments</span>
                                <button onclick="window.deleteRetreat('${snap.id}')" class="text-xs text-red-500 font-bold">DELETE</button>
                            </div>
                        </div>`;
                });
            });
        }
        window.deleteRetreat = (id) => confirm("Delete this retreat?") && deleteDoc(doc(db, "retreats", id));
    </script>
</body>
                            </html>
