<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiential Holidays | Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .form-card { border-top: 10px solid #1e40af; }
        .required-star { color: #ef4444; margin-left: 2px; }
        .scroll-container { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        .management-table th { white-space: nowrap; background: #f8fafc; position: sticky; top: 0; z-index: 10; }
        .management-table td { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-20">

    <nav class="bg-white border-b sticky top-0 z-50 p-4 shadow-sm">
        <div class="max-w-[1400px] mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tight text-blue-800 uppercase">Experiential Holidays</h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="admin-badge" class="hidden bg-red-100 text-red-600 text-[10px] font-bold px-2 py-1 rounded uppercase">Owner Mode</span>
                <span id="user-display-email" class="text-sm font-medium text-slate-500"></span>
                <button id="logout-btn" class="text-xs font-bold text-red-500 uppercase hover:underline">Sign Out</button>
            </div>
            <button id="login-btn" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold">Login with Google</button>
        </div>
    </nav>

    <div class="max-w-[1400px] mx-auto px-4 mt-8">
        <div id="main-app" class="hidden space-y-12">
            
            <div id="form-container" class="bg-white rounded-xl shadow-lg border form-card p-8 max-w-4xl mx-auto">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 id="form-title" class="text-3xl font-extrabold mb-1">Offer your experience</h2>
                        <p class="text-slate-500 text-sm italic">Share your retreat, immersive holiday, or transformational experience with travelers seeking meaningful journeys.</p>
                    </div>
                    <button id="cancel-edit" class="hidden text-xs font-bold text-slate-400 border px-3 py-1 rounded">CANCEL EDIT</button>
                </div>
                
                <input type="hidden" id="editingId">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-1 text-sm">Experience Name (Title) *</label>
                        <input type="text" id="retreatName" class="w-full bg-slate-50 border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>

                    <div>
                        <label class="block font-bold mb-1 text-sm">State/UT *</label>
                        <select id="state" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" required></select>
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-sm">City *</label>
                        <input type="text" id="city" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" required>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2 text-sm">Select Multiple Categories *</label>
                        <div id="category-list" class="grid grid-cols-2 md:grid-cols-3 gap-2 bg-slate-50 p-4 rounded-lg border text-xs"></div>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block font-bold mb-1 text-sm">Your Contribution (Host's Role) *</label>
                        <textarea id="contribution" rows="3" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" placeholder="What will you provide or guide?"></textarea>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block font-bold mb-1 text-sm">Inclusions and Exclusions *</label>
                        <textarea id="inclusionsExclusions" rows="4" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" placeholder="What is included in the cost? What is not included?"></textarea>
                    </div>

                    <div class="md:col-span-2 border-2 border-dashed p-6 rounded-xl text-center bg-slate-50">
                        <label class="block font-bold mb-1">Media Upload (Max 5)</label>
                        <input type="file" id="fileUpload" multiple accept="image/*,video/*,.pdf" class="text-sm block mx-auto">
                        <div id="file-preview-list" class="mt-4 text-left space-y-1 max-w-md mx-auto"></div>
                    </div>

                    <div class="md:col-span-2 mt-4 pt-6 border-t">
                        <h3 class="text-3xl font-extrabold mb-6">Organization & Contact Details</h3>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block font-bold mb-1 text-sm">Organization Name & Bio *</label>
                        <textarea id="orgInfo" rows="2" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" required></textarea>
                    </div>
                    <div>
                        <input type="text" id="contactName" placeholder="Contact Person Name *" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" required>
                    </div>
                    <div>
                        <input type="tel" id="contactWhatsApp" placeholder="WhatsApp Number *" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" required>
                    </div>
                </div>

                <button id="submit-btn" class="mt-8 w-full bg-blue-800 text-white font-black py-4 rounded-xl shadow-lg hover:bg-blue-900 transition uppercase tracking-widest">Save Experience</button>
                <p id="status" class="text-center mt-4 text-sm font-bold text-blue-600"></p>
            </div>

            <div class="bg-white rounded-xl shadow-lg border p-6">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <h3 class="text-2xl font-black uppercase">Experience Management</h3>
                    <input type="text" id="tableSearch" placeholder="Search Title, State, or City..." class="w-full md:w-80 p-2 border rounded bg-slate-50 outline-none">
                </div>
                
                <div class="scroll-container">
                    <table class="management-table text-sm">
                        <thead>
                            <tr class="text-left border-b bg-slate-50">
                                <th class="p-4">Actions</th>
                                <th class="p-4">Title</th>
                                <th class="p-4">Location</th>
                                <th class="p-4">Contribution</th>
                                <th class="p-4">Incl. & Excl.</th>
                                <th class="p-4">Contact</th>
                                <th class="p-4">User</th>
                                <th class="p-4">Files</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // ADMIN CONFIG
        const ADMIN_EMAIL = "your-email@gmail.com"; // Change to your actual email

        const firebaseConfig = {
            apiKey: "AIzaSyAY2ipuHLEq40P-mkN0NaPvZVDrum4NoIs",
            authDomain: "submit-a.firebaseapp.com",
            projectId: "submit-a",
            storageBucket: "submit-a.firebasestorage.app",
            messagingSenderId: "488916289105",
            appId: "1:488916289105:web:ea80aae58690bd09465a70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        const states = ["Andaman and Nicobar Islands", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chandigarh", "Chhattisgarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jammu and Kashmir", "Jharkhand", "Karnataka", "Kerala", "Ladakh", "Lakshadweep", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Puducherry", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"];
        const stateSelect = document.getElementById('state');
        states.forEach(s => stateSelect.innerHTML += `<option>${s}</option>`);

        const categories = ["Wellness & Healing", "Mental Health", "Spirituality", "Fitness & Movement", "Adventure", "Nature & Eco", "Leadership", "Technology", "Creativity & Arts", "Relationships", "Culture & Learning", "Lifestyle", "Luxury & Travel", "Identity", "Other..."];
        const catList = document.getElementById('category-list');
        categories.forEach(c => catList.innerHTML += `<label class="flex items-center gap-2"><input type="checkbox" name="cat" value="${c}"> ${c}</label>`);

        document.getElementById('fileUpload').onchange = (e) => {
            const list = document.getElementById('file-preview-list');
            list.innerHTML = "";
            Array.from(e.target.files).forEach(f => {
                list.innerHTML += `<div class="text-[10px] bg-blue-50 p-1 px-2 rounded border border-blue-100 font-bold text-blue-800">📄 ${f.name}</div>`;
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-display-email').innerText = user.email;
                if(user.email === ADMIN_EMAIL) document.getElementById('admin-badge').classList.remove('hidden');
                loadData(user.email);
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        document.getElementById('submit-btn').onclick = async () => {
            const editId = document.getElementById('editingId').value;
            const status = document.getElementById('status');
            const files = document.getElementById('fileUpload').files;
            
            // Validation
            const name = document.getElementById('retreatName').value;
            const contribution = document.getElementById('contribution').value;
            const inEx = document.getElementById('inclusionsExclusions').value;
            if(!name || !contribution || !inEx) return alert("Please fill all mandatory fields marked with *");

            status.innerText = "Processing...";

            try {
                let fileUrls = [];
                if (files.length > 0) {
                    for (let f of files) {
                        const sRef = ref(storage, `retreats/${Date.now()}_${f.name}`);
                        const snap = await uploadBytes(sRef, f);
                        fileUrls.push(await getDownloadURL(snap.ref));
                    }
                }

                const data = {
                    retreatName: name,
                    state: document.getElementById('state').value,
                    city: document.getElementById('city').value,
                    categories: Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(c => c.value),
                    contribution: contribution,
                    inclusionsExclusions: inEx,
                    orgInfo: document.getElementById('orgInfo').value,
                    contactName: document.getElementById('contactName').value,
                    contactWhatsApp: document.getElementById('contactWhatsApp').value,
                    userEmail: auth.currentUser.email,
                    timestamp: Date.now()
                };

                if(fileUrls.length > 0) data.fileUrls = fileUrls;

                if(editId) {
                    await updateDoc(doc(db, "retreats", editId), data);
                    status.innerText = "Updated Successfully!";
                } else {
                    await addDoc(collection(db, "retreats"), data);
                    status.innerText = "Saved Successfully!";
                }
                setTimeout(() => location.reload(), 1500);
            } catch (e) { status.innerText = "Error: " + e.message; }
        };

        function loadData(userEmail) {
            const q = query(collection(db, "retreats"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const body = document.getElementById('table-body');
                const search = document.getElementById('tableSearch').value.toLowerCase();
                body.innerHTML = "";
                snapshot.forEach((snap) => {
                    const r = snap.data();
                    if(userEmail !== ADMIN_EMAIL && r.userEmail !== userEmail) return;

                    if(r.retreatName.toLowerCase().includes(search) || r.city.toLowerCase().includes(search)) {
                        body.innerHTML += `
                            <tr class="border-b hover:bg-slate-50 transition">
                                <td class="p-4 flex gap-2">
                                    <button onclick="editExp('${snap.id}')" class="text-blue-600 font-bold">EDIT</button>
                                    <button onclick="delExp('${snap.id}')" class="text-red-400">DEL</button>
                                </td>
                                <td class="p-4 font-bold text-blue-900">${r.retreatName}</td>
                                <td class="p-4">${r.city}, ${r.state}</td>
                                <td class="p-4" title="${r.contribution}">${r.contribution}</td>
                                <td class="p-4" title="${r.inclusionsExclusions}">${r.inclusionsExclusions}</td>
                                <td class="p-4">${r.contactName}</td>
                                <td class="p-4 text-[10px] text-slate-400">${r.userEmail}</td>
                                <td class="p-4">${r.fileUrls ? r.fileUrls.length : 0} Files</td>
                            </tr>
                        `;
                    }
                });
            });
        }

        document.getElementById('tableSearch').oninput = () => loadData(auth.currentUser.email);

        window.editExp = async (id) => {
            const d = await getDoc(doc(db, "retreats", id));
            const r = d.data();
            document.getElementById('editingId').value = id;
            document.getElementById('retreatName').value = r.retreatName;
            document.getElementById('state').value = r.state;
            document.getElementById('city').value = r.city;
            document.getElementById('contribution').value = r.contribution;
            document.getElementById('inclusionsExclusions').value = r.inclusionsExclusions;
            document.getElementById('orgInfo').value = r.orgInfo;
            document.getElementById('contactName').value = r.contactName;
            document.getElementById('contactWhatsApp').value = r.contactWhatsApp;
            
            document.querySelectorAll('input[name="cat"]').forEach(cb => {
                cb.checked = r.categories.includes(cb.value);
            });

            document.getElementById('form-title').innerText = "Update Experience";
            document.getElementById('cancel-edit').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.delExp = (id) => confirm("Delete this experience?") && deleteDoc(doc(db, "retreats", id));
        document.getElementById('cancel-edit').onclick = () => location.reload();
    </script>
</body>
</html>
