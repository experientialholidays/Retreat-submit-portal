<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiential Holidays | Full Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .form-card { border-top: 10px solid #1e40af; }
        .scroll-container { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; max-height: 700px; }
        .management-table { border-collapse: separate; border-spacing: 0; }
        .management-table th { 
            white-space: nowrap; 
            background: #f8fafc; 
            position: sticky; 
            top: 0; 
            z-index: 20; 
            border-bottom: 2px solid #e2e8f0;
            padding: 12px;
        }
        .management-table td { 
            max-width: 180px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
            border-bottom: 1px solid #f1f5f9;
            padding: 10px;
        }
        .filter-input {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 4px 8px;
            font-size: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-weight: normal;
            color: #1e293b;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-20">

    <nav class="bg-white border-b sticky top-0 z-50 p-4 shadow-sm">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tight text-blue-800 uppercase">Experiential Holidays</h1>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="admin-badge" class="hidden bg-red-100 text-red-600 text-[10px] font-bold px-2 py-1 rounded uppercase">Owner Mode</span>
                <span id="user-display-email" class="text-sm font-medium text-slate-500"></span>
                <button id="logout-btn" class="text-xs font-bold text-red-500 uppercase hover:underline">Sign Out</button>
            </div>
            <button id="login-btn" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold">Login with Google</button>
        </div>
    </nav>

    <div class="max-w-[1600px] mx-auto px-4 mt-8">
        <div id="main-app" class="hidden space-y-10">
            
            <div id="form-container" class="bg-white rounded-xl shadow-lg border form-card p-8 max-w-5xl mx-auto">
                <div class="flex justify-between items-start mb-6">
                    <h2 id="form-title" class="text-3xl font-extrabold">Experience Submission</h2>
                    <button id="cancel-edit" class="hidden text-xs font-bold text-slate-400 border px-3 py-1 rounded">CANCEL EDIT</button>
                </div>
                
                <input type="hidden" id="editingId">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-1 text-sm">Experience Name (Title) *</label>
                        <input type="text" id="retreatName" class="w-full bg-slate-50 border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-sm">Host Email (User Login) *</label>
                        <input type="email" id="hostEmail" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" required>
                    </div>

                    <div>
                        <label class="block font-bold mb-1 text-sm">State/UT *</label>
                        <select id="state" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" required></select>
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-sm">City *</label>
                        <input type="text" id="city" class="w-full bg-slate-50 border p-3 rounded-lg outline-none" required>
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-sm">Categories *</label>
                        <div id="category-list" class="grid grid-cols-2 gap-1 bg-slate-50 p-2 rounded-lg border text-[10px] h-32 overflow-y-auto"></div>
                    </div>

                    <div>
                        <label class="block font-bold mb-1 text-sm">Start Date/Time *</label>
                        <div class="flex gap-2">
                            <input type="date" id="startDate" class="w-full bg-slate-50 border p-2 rounded text-sm" required>
                            <input type="time" id="startTime" class="w-full bg-slate-50 border p-2 rounded text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-sm">End Date/Time</label>
                        <div class="flex gap-2">
                            <input type="date" id="endDate" class="w-full bg-slate-50 border p-2 rounded text-sm">
                            <input type="time" id="endTime" class="w-full bg-slate-50 border p-2 rounded text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-sm">General Description *</label>
                        <textarea id="description" rows="2" class="w-full bg-slate-50 border p-3 rounded-lg outline-none text-sm" required></textarea>
                    </div>

                    <div class="md:col-span-3 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block font-bold mb-1 text-sm">Contribution</label>
                            <textarea id="contribution" rows="3" class="w-full bg-slate-50 border p-3 rounded-lg outline-none text-sm" placeholder="Optional details..."></textarea>
                        </div>
                        <div>
                            <label class="block font-bold mb-1 text-sm">Inclusion & Exclusion</label>
                            <textarea id="inclusionsExclusions" rows="3" class="w-full bg-slate-50 border p-3 rounded-lg outline-none text-sm" placeholder="Optional details..."></textarea>
                        </div>
                    </div>

                    <div class="md:col-span-3 border-2 border-dashed p-4 rounded-xl text-center bg-slate-50">
                        <label class="block font-bold mb-4 text-sm uppercase text-slate-500">Media & Links</label>
                        
                        <div class="text-left mb-4 max-w-xl mx-auto">
                            <label class="block font-bold mb-1 text-sm">YouTube Video Link</label>
                            <input type="url" id="youtubeLink" class="w-full bg-white border p-3 rounded-lg outline-none text-sm" placeholder="https://www.youtube.com/watch?v=...">
                        </div>

                        <div class="text-left max-w-xl mx-auto">
                            <label class="block font-bold mb-1 text-sm">Image & Media Upload</label>
                            <input type="file" id="fileUpload" multiple accept="image/*, application/pdf" class="text-xs w-full">
                            <div id="file-preview-list" class="mt-2 text-[10px] text-blue-600 font-bold"></div>
                        </div>
                    </div>

                    <div class="md:col-span-1">
                        <label class="block font-bold mb-1 text-sm">Organization Bio *</label>
                        <textarea id="orgInfo" rows="2" class="w-full bg-slate-50 border p-3 rounded-lg outline-none text-sm" required></textarea>
                    </div>
                    <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block font-bold mb-1 text-sm">Contact Name *</label>
                            <input type="text" id="contactName" class="w-full bg-slate-50 border p-3 rounded-lg outline-none text-sm" required>
                        </div>
                        <div>
                            <label class="block font-bold mb-1 text-sm">WhatsApp Number *</label>
                            <input type="tel" id="contactWhatsApp" class="w-full bg-slate-50 border p-3 rounded-lg outline-none text-sm" required>
                        </div>
                        <div>
                            <label class="block font-bold mb-1 text-sm">Org Contact Email *</label>
                            <input type="email" id="orgContactEmail" class="w-full bg-slate-50 border p-3 rounded-lg outline-none text-sm" required>
                        </div>
                    </div>
                </div>

                <button id="submit-btn" class="mt-8 w-full bg-blue-800 text-white font-black py-4 rounded-xl shadow-lg hover:bg-blue-900 transition uppercase tracking-widest">Save Record</button>
                <p id="status" class="text-center mt-4 text-sm font-bold text-blue-600"></p>
            </div>

            <div class="bg-white rounded-xl shadow-lg border p-6 overflow-hidden">
                <h3 class="text-2xl font-black uppercase mb-4">Master Database Review</h3>
                
                <div class="scroll-container">
                    <table id="masterTable" class="management-table w-full text-[11px]">
                        <thead>
                            <tr class="text-left border-b bg-slate-50">
                                <th class="p-4">Actions</th>
                                <th>Title <input type="text" class="filter-input" onkeyup="excelFilter(1, this.value)"></th>
                                <th>Host Email <input type="text" class="filter-input" onkeyup="excelFilter(2, this.value)"></th>
                                <th>Location <input type="text" class="filter-input" onkeyup="excelFilter(3, this.value)"></th>
                                <th>Start <input type="text" class="filter-input" onkeyup="excelFilter(4, this.value)"></th>
                                <th>End <input type="text" class="filter-input" onkeyup="excelFilter(5, this.value)"></th>
                                <th>Description <input type="text" class="filter-input" onkeyup="excelFilter(6, this.value)"></th>
                                <th>Contribution <input type="text" class="filter-input" onkeyup="excelFilter(7, this.value)"></th>
                                <th>Inc/Exc <input type="text" class="filter-input" onkeyup="excelFilter(8, this.value)"></th>
                                <th>Categories <input type="text" class="filter-input" onkeyup="excelFilter(9, this.value)"></th>
                                <th>YouTube <input type="text" class="filter-input" onkeyup="excelFilter(10, this.value)"></th>
                                <th>Contact Name/WA <input type="text" class="filter-input" onkeyup="excelFilter(11, this.value)"></th>
                                <th>Org Email <input type="text" class="filter-input" onkeyup="excelFilter(12, this.value)"></th>
                                <th>Org Bio <input type="text" class="filter-input" onkeyup="excelFilter(13, this.value)"></th>
                                <th>Images/Files <input type="text" class="filter-input" onkeyup="excelFilter(14, this.value)"></th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const ADMIN_EMAIL = "your-email@gmail.com"; // SET YOUR EMAIL HERE

        const firebaseConfig = {
            apiKey: "AIzaSyAY2ipuHLEq40P-mkN0NaPvZVDrum4NoIs",
            authDomain: "submit-a.firebaseapp.com",
            projectId: "submit-a",
            storageBucket: "submit-a.firebasestorage.app",
            messagingSenderId: "488916289105",
            appId: "1:488916289105:web:ea80aae58690bd09465a70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        const states = ["Andaman and Nicobar Islands", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chandigarh", "Chhattisgarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jammu and Kashmir", "Jharkhand", "Karnataka", "Kerala", "Ladakh", "Lakshadweep", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Puducherry", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal"];
        const stateSelect = document.getElementById('state');
        states.forEach(s => stateSelect.innerHTML += `<option>${s}</option>`);

        const categories = ["Wellness & Healing", "Mental Health", "Spirituality", "Fitness", "Adventure", "Nature", "Leadership", "Technology", "Arts", "Culture", "Luxury", "Identity"];
        const catList = document.getElementById('category-list');
        categories.forEach(c => catList.innerHTML += `<label class="flex items-center gap-2"><input type="checkbox" name="cat" value="${c}"> ${c}</label>`);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-display-email').innerText = user.email;
                if(user.email === ADMIN_EMAIL) document.getElementById('admin-badge').classList.remove('hidden');
                loadData(user.email);
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        document.getElementById('submit-btn').onclick = async () => {
            const editId = document.getElementById('editingId').value;
            const status = document.getElementById('status');
            const files = document.getElementById('fileUpload').files;

            status.innerText = "Processing...";

            try {
                let fileUrls = [];
                // If editing and no new files uploaded, we should ideally keep the old ones.
                // For simplicity here, new uploads will overwrite or append depending on how you build it later.
                for (let f of files) {
                    const sRef = ref(storage, `retreats/${Date.now()}_${f.name}`);
                    const snap = await uploadBytes(sRef, f);
                    fileUrls.push(await getDownloadURL(snap.ref));
                }

                const data = {
                    retreatName: document.getElementById('retreatName').value,
                    hostEmail: document.getElementById('hostEmail').value,
                    state: document.getElementById('state').value,
                    city: document.getElementById('city').value,
                    startDate: document.getElementById('startDate').value,
                    startTime: document.getElementById('startTime').value,
                    endDate: document.getElementById('endDate').value,
                    endTime: document.getElementById('endTime').value,
                    description: document.getElementById('description').value,
                    categories: Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(c => c.value),
                    contribution: document.getElementById('contribution').value,
                    inclusionsExclusions: document.getElementById('inclusionsExclusions').value,
                    youtubeLink: document.getElementById('youtubeLink').value,
                    orgInfo: document.getElementById('orgInfo').value,
                    contactName: document.getElementById('contactName').value,
                    contactWhatsApp: document.getElementById('contactWhatsApp').value,
                    orgContactEmail: document.getElementById('orgContactEmail').value, // SAVING ORG EMAIL
                    submittingUser: auth.currentUser.email,
                    timestamp: Date.now()
                };

                if(fileUrls.length > 0) data.fileUrls = fileUrls;

                if(editId) {
                    await updateDoc(doc(db, "retreats", editId), data);
                } else {
                    await addDoc(collection(db, "retreats"), data);
                }
                location.reload();
            } catch (e) { status.innerText = "Error: " + e.message; }
        };

        function loadData(userEmail) {
            const q = query(collection(db, "retreats"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const body = document.getElementById('table-body');
                body.innerHTML = "";
                snapshot.forEach((snap) => {
                    const r = snap.data();
                    if(userEmail !== ADMIN_EMAIL && r.submittingUser !== userEmail) return;

                    const youtubeDisplay = r.youtubeLink ? `<a href="${r.youtubeLink}" target="_blank" class="text-blue-500 font-bold hover:underline">Watch</a>` : '-';

                    body.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="flex gap-2">
                                <button onclick="editExp('${snap.id}')" class="text-blue-600 font-bold">EDIT</button>
                                <button onclick="delExp('${snap.id}')" class="text-red-400">DEL</button>
                            </td>
                            <td title="${r.retreatName}">${r.retreatName}</td>
                            <td>${r.hostEmail}</td>
                            <td>${r.city}, ${r.state}</td>
                            <td>${r.startDate} ${r.startTime}</td>
                            <td>${r.endDate} ${r.endTime}</td>
                            <td title="${r.description}">${r.description}</td>
                            <td title="${r.contribution}">${r.contribution}</td>
                            <td title="${r.inclusionsExclusions}">${r.inclusionsExclusions}</td>
                            <td>${r.categories.join(', ')}</td>
                            <td>${youtubeDisplay}</td>
                            <td>${r.contactName} (${r.contactWhatsApp})</td>
                            <td>${r.orgContactEmail || "-"}</td> <td title="${r.orgInfo}">${r.orgInfo}</td>
                            <td>${r.fileUrls ? r.fileUrls.length : 0} Images/Files</td>
                        </tr>
                    `;
                });
            });
        }

        window.excelFilter = (colIndex, value) => {
            const table = document.getElementById("masterTable");
            const rows = table.getElementsByTagName("tr");
            const filter = value.toLowerCase();

            for (let i = 1; i < rows.length; i++) {
                const td = rows[i].getElementsByTagName("td")[colIndex];
                if (td) {
                    const text = td.textContent || td.innerText;
                    rows[i].style.display = text.toLowerCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        };

        window.editExp = async (id) => {
            const d = await getDoc(doc(db, "retreats", id));
            const r = d.data();
            document.getElementById('editingId').value = id;
            document.getElementById('retreatName').value = r.retreatName;
            document.getElementById('hostEmail').value = r.hostEmail;
            document.getElementById('state').value = r.state;
            document.getElementById('city').value = r.city;
            document.getElementById('startDate').value = r.startDate;
            document.getElementById('startTime').value = r.startTime;
            document.getElementById('endDate').value = r.endDate;
            document.getElementById('endTime').value = r.endTime;
            document.getElementById('description').value = r.description;
            document.getElementById('contribution').value = r.contribution || "";
            document.getElementById('inclusionsExclusions').value = r.inclusionsExclusions || "";
            document.getElementById('youtubeLink').value = r.youtubeLink || "";
            document.getElementById('orgInfo').value = r.orgInfo;
            document.getElementById('contactName').value = r.contactName;
            document.getElementById('contactWhatsApp').value = r.contactWhatsApp;
            
            // LOAD ORG EMAIL IN EDIT MODE
            document.getElementById('orgContactEmail').value = r.orgContactEmail || "";
            
            document.querySelectorAll('input[name="cat"]').forEach(cb => {
                cb.checked = r.categories.includes(cb.value);
            });

            document.getElementById('form-title').innerText = "Update: " + r.retreatName;
            document.getElementById('cancel-edit').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.delExp = (id) => confirm("Delete this permanent record?") && deleteDoc(doc(db, "retreats", id));
        document.getElementById('cancel-edit').onclick = () => location.reload();
    </script>
</body>
</html>
