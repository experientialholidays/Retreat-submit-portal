<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit an Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; color: #334155; font-size: 17px; }
        .form-section { background: white; border-radius: 16px; padding: 24px; border: 1px solid #f1f5f9; margin-bottom: 24px; }
        .input-label { display: block; text-transform: uppercase; font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 6px; letter-spacing: 0.025em; }
        .custom-input { width: 100%; background: #fdfdfd; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; outline: none; transition: 0.2s; font-size: 15px; }
        .custom-input:focus { border-color: #ffeadb; background: #ffffff; box-shadow: 0 0 0 2px rgba(255, 234, 219, 0.5); }
        .bg-peach { background-color: #ffeadb; }
        .text-peach-dark { color: #855d48; }
        .btn-primary { background: #ffeadb; color: #855d48; padding: 14px; border-radius: 12px; font-weight: 700; transition: 0.3s; width: 100%; text-transform: uppercase; letter-spacing: 1px; border: 1px solid #f5d6c4; }
        .btn-primary:hover { background: #f5d6c4; }
        .btn-soft { background: #f8fafc; color: #64748b; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; transition: 0.2s; border: 1px solid #e2e8f0; }
        .btn-soft:hover { background: #ffeadb; color: #855d48; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-peach text-peach-dark p-4 sticky top-0 z-50 shadow-sm border-b border-[#f5d6c4]">
        <div class="max-w-[1200px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <h1 class="text-xl font-bold tracking-tight uppercase">Experiential <span class="opacity-70">Holidays</span></h1>
            <div id="auth-section" class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                <button id="login-btn" class="bg-white text-peach-dark px-5 py-1.5 rounded-md font-bold text-sm border border-[#f5d6c4]">Sign In</button>
                <div id="user-profile" class="hidden flex flex-col md:flex-row items-center gap-3">
                    <span id="user-email" class="text-peach-dark font-medium text-sm md:border-r md:border-[#f5d6c4] md:pr-3"></span>
                    <a href="dashboard.html" class="text-peach-dark hover:opacity-70 font-bold text-sm">My Dashboard</a>
                    <button id="logout-btn" class="text-peach-dark opacity-60 hover:opacity-100 text-[11px] uppercase font-bold">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <form id="main-content" class="hidden max-w-[1000px] mx-auto p-4 md:p-8">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h2 id="form-title" class="text-2xl font-bold text-slate-800 uppercase tracking-tight">Submit an Experience</h2>
            </div>
            <a href="index.html" id="cancel-edit" class="hidden text-red-500 text-xs font-bold uppercase border border-red-100 px-3 py-1 rounded">Discard Changes</a>
        </header>

        <input type="hidden" id="editingId">

        <div class="form-section shadow-sm">
            <h3 class="text-xs font-bold text-orange-400 uppercase tracking-widest mb-6">01 Basic Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2"><label class="input-label">Experience Title *</label><input type="text" id="retreatName" class="custom-input" required></div>
                <div><label class="input-label">State/UT *</label><select id="state" class="custom-input" required></select></div>
                <div><label class="input-label">City (nearest city) *</label><input type="text" id="city" class="custom-input" required></div>
                <div><label class="input-label">Start Date & Time *</label><div class="flex gap-2"><input type="date" id="startDate" class="custom-input" required><input type="time" id="startTime" class="custom-input w-28" required></div></div>
                <div><label class="input-label">End Date & Time *</label><div class="flex gap-2"><input type="date" id="endDate" class="custom-input" required><input type="time" id="endTime" class="custom-input w-28" required></div></div>
            </div>
        </div>

        <div class="form-section shadow-sm">
            <h3 class="text-xs font-bold text-orange-400 uppercase tracking-widest mb-6">02 Detailed Information</h3>
            <div class="space-y-6">
                <div>
                    <label class="input-label">Pick Multiple Categories *</label>
                    <div id="category-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 p-4 bg-slate-50 rounded-lg border border-slate-200 h-40 overflow-y-auto"></div>
                    <input type="text" id="otherCategory" class="hidden mt-2 custom-input" placeholder="Custom category...">
                </div>
                <div><label class="input-label">General Description *</label><textarea id="description" rows="4" class="custom-input" required></textarea></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div><label class="input-label">Contribution / Price Details</label><textarea id="contribution" rows="3" class="custom-input"></textarea></div>
                    <div><label class="input-label">Inclusions & Exclusions</label><textarea id="inclusionsExclusions" rows="3" class="custom-input"></textarea></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="input-label">Video Link (YouTube or Instagram) (Max 5)</label>
                        <div id="video-links-container" class="space-y-2"><input type="url" class="video-link-input custom-input" placeholder="https://..."></div>
                        <button type="button" id="add-video-link-btn" class="mt-2 btn-soft">+ Add Another Video Link</button>
                    </div>
                    <div>
                        <label class="input-label">Media Upload (Max 10)</label>
                        <!-- Existing file renderer element container -->
                        <div id="existing-files-container" class="space-y-1 mb-3"></div>
                        <div id="file-upload-container" class="space-y-2"><input type="file" class="file-input-item block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-white file:border file:border-slate-200"></div>
                        <button type="button" id="add-file-btn" class="mt-2 btn-soft">+ Add Another File</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section shadow-sm">
            <h3 class="text-xs font-bold text-orange-400 uppercase tracking-widest mb-6">03 Contact Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2"><label class="input-label">Organization name (with Bio) *</label><textarea id="orgInfo" rows="2" class="custom-input" required></textarea></div>
                <div><label class="input-label">Contact person name *</label><input type="text" id="contactName" class="custom-input" required></div>
                <div><label class="input-label">Contact Email *</label><input type="email" id="orgContactEmail" class="custom-input" required></div>
                <div><label class="input-label">WhatsApp Number *</label><div class="flex gap-2"><input type="text" id="countryCode" class="w-16 custom-input text-center" value="+91" required><input type="tel" id="contactWhatsApp" class="flex-1 custom-input" required></div></div>
                <div class="md:col-span-2 pt-2 border-t border-slate-50">
                    <label class="input-label">External Links (Max 5)</label>
                    <div id="external-links-container" class="space-y-2"><input type="url" class="external-link-input custom-input" placeholder="https://..."></div>
                    <button type="button" id="add-link-btn" class="mt-2 btn-soft">+ Add Another Link</button>
                </div>
            </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary mb-12 shadow-md">Publish Experience</button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2ipuHLEq40P-mkN0NaPvZVDrum4NoIs",
            authDomain: "submit-a.firebaseapp.com",
            projectId: "submit-a",
            storageBucket: "submit-a.firebasestorage.app",
            messagingSenderId: "488916289105",
            appId: "1:488916289105:web:ea80aae58690bd09465a70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        const ALL_CATEGORIES = ["Wellness & Healing", "Mental Health & Emotional Growth", "Spirituality & Consciousness", "Fitness, Movement & Martial Arts", "Adventure & Outdoor Exploration", "Nature, Sustainability & Eco Living", "Leadership, Business & Career", "Technology & Innovation", "Creativity & Arts", "Relationships & Connection", "Culture, Philosophy & Learning", "Lifestyle & Personal Transformation", "Luxury, Leisure & Travel", "Identity & Belonging", "Other"];
        const STATES = ["Andaman and Nicobar", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chandigarh", "Chhattisgarh", "D&N Haveli & Daman Diu", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "JK", "Jharkhand", "Karnataka", "Kerala", "Ladakh", "Lakshadweep", "MP", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Puducherry", "Punjab", "Rajasthan", "Sikkim", "TN", "Telangana", "Tripura", "UP", "Uttarakhand", "West Bengal"];

        // Tracks existing database attachments currently loaded into Edit View
        let existingFileUrls = [];

        const stateSelect = document.getElementById('state');
        stateSelect.innerHTML += `<option value="">Select State</option>`;
        STATES.forEach(s => stateSelect.innerHTML += `<option value="${s}">${s}</option>`);
        
        const catList = document.getElementById('category-list');
        ALL_CATEGORIES.forEach(c => {
            catList.innerHTML += `<label class="flex items-center gap-3 text-sm bg-white p-2 rounded-md border border-slate-100 cursor-pointer hover:bg-slate-50 transition">
                <input type="checkbox" name="cat" value="${c}" class="w-4 h-4 rounded border-slate-300 text-orange-400" onchange="window.toggleOtherInput(this)"> 
                <span class="text-slate-600">${c}</span>
            </label>`;
        });

        window.toggleOtherInput = (cb) => {
            const otherInput = document.getElementById('otherCategory');
            if(cb.value === 'Other') {
                otherInput.classList.toggle('hidden', !cb.checked);
                if(cb.checked) otherInput.focus();
            }
        };

        document.getElementById('add-file-btn').onclick = () => {
            const container = document.getElementById('file-upload-container');
            if (container.querySelectorAll('input').length < 10) {
                const input = document.createElement('input');
                input.type = 'file';
                input.className = "file-input-item block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:bg-white file:border file:border-slate-200 mt-2";
                container.appendChild(input);
            }
        };

        document.getElementById('add-link-btn').onclick = () => {
            const container = document.getElementById('external-links-container');
            if (container.querySelectorAll('input').length < 5) {
                const input = document.createElement('input');
                input.type = 'url';
                input.className = 'external-link-input custom-input mt-2';
                input.placeholder = 'https://...';
                container.appendChild(input);
            }
        };

        document.getElementById('add-video-link-btn').onclick = () => {
            const container = document.getElementById('video-links-container');
            if (container.querySelectorAll('input').length < 5) {
                const input = document.createElement('input');
                input.type = 'url';
                input.className = 'video-link-input custom-input mt-2';
                input.placeholder = 'https://...';
                container.appendChild(input);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                const urlParams = new URLSearchParams(window.location.search);
                const editId = urlParams.get('editId');
                if(editId) loadEditData(editId);
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-profile').classList.add('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        window.deleteExistingFile = (index) => {
            existingFileUrls.splice(index, 1);
            renderExistingFiles();
        };

        function renderExistingFiles() {
            const fileContainer = document.getElementById('existing-files-container');
            fileContainer.innerHTML = '';
            existingFileUrls.forEach((url, i) => {
                let fileName = `File ${i + 1}`;
                try {
                    const decoded = decodeURIComponent(url);
                    fileName = decoded.split('/').pop().split('?')[0] || fileName;
                } catch(e) {}
                
                fileContainer.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-100 p-2 rounded text-xs mt-1 border border-slate-200">
                        <a href="${url}" target="_blank" class="text-[#0284c7] underline truncate max-w-[80%]" title="${fileName}">${fileName}</a>
                        <button type="button" onclick="window.deleteExistingFile(${i})" class="text-red-500 font-bold hover:text-red-700 ml-2 uppercase text-[10px] tracking-wider">Delete</button>
                    </div>
                `;
            });
        }

        async function loadEditData(id) {
            const snap = await getDoc(doc(db, "retreats", id));
            if(!snap.exists()) return;
            const r = snap.data();
            
            document.getElementById('editingId').value = id;
            document.getElementById('retreatName').value = r.retreatName || "";
            document.getElementById('state').value = r.state || "";
            document.getElementById('city').value = r.city || "";
            document.getElementById('startDate').value = r.startDate || "";
            document.getElementById('startTime').value = r.startTime || "";
            document.getElementById('endDate').value = r.endDate || "";
            document.getElementById('endTime').value = r.endTime || "";
            document.getElementById('description').value = r.description || "";
            document.getElementById('contribution').value = r.contribution || "";
            document.getElementById('inclusionsExclusions').value = r.inclusionsExclusions || "";
            document.getElementById('orgInfo').value = r.orgInfo || "";
            document.getElementById('contactName').value = r.contactName || "";
            document.getElementById('orgContactEmail').value = r.orgContactEmail || "";

            if (r.videoLinks && r.videoLinks.length > 0) {
                const container = document.getElementById('video-links-container');
                container.innerHTML = '';
                r.videoLinks.forEach(link => {
                    const input = document.createElement('input');
                    input.type = 'url';
                    input.className = 'video-link-input custom-input mt-2';
                    input.value = link;
                    container.appendChild(input);
                });
            }

            if (r.contactWhatsApp && r.contactWhatsApp.includes('+')) {
                document.getElementById('countryCode').value = r.contactWhatsApp.substring(0, 3);
                document.getElementById('contactWhatsApp').value = r.contactWhatsApp.substring(3);
            } else {
                document.getElementById('contactWhatsApp').value = r.contactWhatsApp || "";
            }

            const savedCats = r.categories || [];
            const checkboxes = document.querySelectorAll('input[name="cat"]');
            let hasOther = false;
            savedCats.forEach(cat => {
                let found = false;
                checkboxes.forEach(cb => {
                    if (cb.value === cat) { cb.checked = true; found = true; }
                });
                if (!found) { hasOther = true; document.getElementById('otherCategory').value = cat; }
            });
            if(hasOther) {
                checkboxes.forEach(cb => { if(cb.value === 'Other') cb.checked = true; });
                document.getElementById('otherCategory').classList.remove('hidden');
            }

            if (r.externalLinks && r.externalLinks.length > 0) {
                const container = document.getElementById('external-links-container');
                container.innerHTML = '';
                r.externalLinks.forEach(link => {
                    const input = document.createElement('input');
                    input.type = 'url';
                    input.className = 'external-link-input custom-input mt-2';
                    input.value = link;
                    container.appendChild(input);
                });
            }
            
            if (r.fileUrls && r.fileUrls.length > 0) {
                existingFileUrls = [...r.fileUrls];
                renderExistingFiles();
            }

            document.getElementById('form-title').innerText = "Update Experience";
            document.getElementById('cancel-edit').classList.remove('hidden');
            document.getElementById('submit-btn').innerText = "Save Changes";
        }

        document.getElementById('main-content').onsubmit = async (e) => {
            e.preventDefault();

            const selectedCatsCheck = document.querySelectorAll('input[name="cat"]:checked');
            if (selectedCatsCheck.length === 0) {
                alert("Please select at least one category.");
                document.getElementById('category-list').scrollIntoView({ behavior: 'smooth' });
                return;
            }

            const btn = document.getElementById('submit-btn');
            const editId = document.getElementById('editingId').value;
            btn.innerText = "PROCESSING..."; btn.disabled = true;
            try {
                let newFileUrls = [];
                const fileInputs = document.querySelectorAll('.file-input-item');
                for (let input of fileInputs) {
                    if (input.files[0]) {
                        const sRef = ref(storage, `retreats/${Date.now()}_${input.files[0].name}`);
                        const snap = await uploadBytes(sRef, input.files[0]);
                        newFileUrls.push(await getDownloadURL(snap.ref));
                    }
                }

                const finalFileUrls = [...existingFileUrls, ...newFileUrls];

                let selectedCats = Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(c => c.value);
                if(selectedCats.includes('Other')) {
                    const custom = document.getElementById('otherCategory').value;
                    if(custom) selectedCats.push(custom);
                    selectedCats = selectedCats.filter(c => c !== 'Other');
                }

                const data = {
                    retreatName: document.getElementById('retreatName').value,
                    hostEmail: auth.currentUser.email,
                    state: document.getElementById('state').value,
                    city: document.getElementById('city').value,
                    startDate: document.getElementById('startDate').value,
                    startTime: document.getElementById('startTime').value,
                    endDate: document.getElementById('endDate').value,
                    endTime: document.getElementById('endTime').value,
                    description: document.getElementById('description').value,
                    categories: selectedCats,
                    contribution: document.getElementById('contribution').value,
                    inclusionsExclusions: document.getElementById('inclusionsExclusions').value,
                    videoLinks: Array.from(document.querySelectorAll('.video-link-input')).map(i => i.value).filter(v => v !== ""),
                    orgInfo: document.getElementById('orgInfo').value,
                    contactName: document.getElementById('contactName').value,
                    contactWhatsApp: document.getElementById('countryCode').value + document.getElementById('contactWhatsApp').value,
                    orgContactEmail: document.getElementById('orgContactEmail').value,
                    externalLinks: Array.from(document.querySelectorAll('.external-link-input')).map(i => i.value).filter(v => v !== ""),
                    fileUrls: finalFileUrls,
                    timestamp: Date.now()
                };

                if(editId) await updateDoc(doc(db, "retreats", editId), data);
                else await addDoc(collection(db, "retreats"), data);
                window.location.href = "dashboard.html";
            } catch (e) { alert(e.message); btn.innerText = "Publish Experience"; btn.disabled = false; }
        };
    </script>
</body>
    </html>
