<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retreat Submission Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .form-card { border-top: 10px solid #1e40af; } /* Professional Blue Accent */
        input[type="checkbox"]:checked + label { color: #1e40af; font-weight: bold; }
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 pb-20">

    <!-- NAVIGATION / AUTH -->
    <nav class="bg-white border-b sticky top-0 z-50 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tight text-blue-800 uppercase">Retreat Hub</h1>
            <button id="login-btn" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-700 shadow-md transition">Login with Google</button>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-display-email" class="text-sm font-medium text-slate-500"></span>
                <button id="logout-btn" class="text-xs font-bold text-red-500 uppercase hover:underline">Sign Out</button>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 mt-8">
        
        <!-- LOGIN PROMPT -->
        <div id="login-prompt" class="text-center py-20 bg-white rounded-2xl shadow-sm border">
            <h2 class="text-2xl font-bold mb-2">Welcome to the Retreat Portal</h2>
            <p class="text-slate-500 mb-6">Please sign in to submit or manage your retreats.</p>
        </div>

        <!-- MAIN FORM (Hidden until Login) -->
        <div id="main-app" class="hidden space-y-8">
            
            <div id="form-container" class="bg-white rounded-xl shadow-lg border form-card p-8">
                <h2 id="form-usage-title" class="text-3xl font-extrabold mb-6">Submit your Retreat</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 1. Retreat Name -->
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">Retreat Name *</label>
                        <input type="text" id="retreatName" class="w-full bg-slate-50 border-b-2 border-slate-200 p-3 outline-none focus:border-blue-600 transition">
                    </div>

                    <!-- 2. Pick State -->
                    <div>
                        <label class="block font-bold mb-2">Pick State *</label>
                        <select id="state" class="w-full bg-slate-50 border p-3 rounded-lg outline-none">
                            <option value="">Select State/UT</option>
                            <option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option><option>Bihar</option><option>Chhattisgarh</option>
                            <option>Goa</option><option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option><option>Jharkhand</option>
                            <option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option>
                            <option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option><option>Odisha</option><option>Punjab</option>
                            <option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option>
                            <option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option>
                            <option disabled>──────────</option>
                            <option>Delhi</option><option>Jammu and Kashmir</option><option>Ladakh</option><option>Puducherry</option><option>Chandigarh</option>
                        </select>
                    </div>

                    <!-- 3. City -->
                    <div>
                        <label class="block font-bold mb-2">City (Nearest city) *</label>
                        <input type="text" id="city" class="w-full bg-slate-50 border-b-2 border-slate-200 p-3 outline-none focus:border-blue-600 transition">
                    </div>

                    <!-- 4. Dates -->
                    <div>
                        <label class="block font-bold mb-2">Start Date & Time *</label>
                        <div class="flex gap-2">
                            <input type="date" id="startDate" class="w-full bg-slate-50 border p-3 rounded-lg">
                            <input type="time" id="startTime" class="w-full bg-slate-50 border p-3 rounded-lg">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold mb-2">End Date & Time</label>
                        <div class="flex gap-2">
                            <input type="date" id="endDate" class="w-full bg-slate-50 border p-3 rounded-lg">
                            <input type="time" id="endTime" class="w-full bg-slate-50 border p-3 rounded-lg">
                        </div>
                    </div>

                    <!-- 8. Categories (Checkboxes) -->
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-3">Select Categories * (Check all that apply)</label>
                        <div id="category-list" class="grid grid-cols-2 md:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-xl max-h-60 overflow-y-auto border">
                            <!-- JS will populate these -->
                        </div>
                    </div>

                    <!-- 9 & 10. Descriptions -->
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">Description *</label>
                        <textarea id="description" rows="4" class="w-full bg-slate-50 border p-3 rounded-lg outline-none"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">Contribution (Inclusions & Exclusions)</label>
                        <textarea id="contribution" rows="3" class="w-full bg-slate-50 border p-3 rounded-lg outline-none"></textarea>
                    </div>

                    <!-- 11. File Upload -->
                    <div class="md:col-span-2 border-2 border-dashed border-slate-200 p-6 rounded-xl text-center bg-slate-50">
                        <label class="block font-bold mb-2">Upload Image, PDF or Video</label>
                        <input type="file" id="fileUpload" class="text-sm">
                        <p class="text-[10px] text-slate-400 mt-2">Maximum file size: 50MB</p>
                    </div>

                    <!-- Organization Info -->
                    <div class="md:col-span-2 mt-4 pt-6 border-t">
                        <h3 class="text-lg font-bold mb-4 text-blue-800 underline">Organization & Contact Details</h3>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block font-bold mb-2">Organization Name & Bio *</label>
                        <textarea id="orgInfo" rows="2" class="w-full bg-slate-50 border p-3 rounded-lg outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block font-bold mb-2">Contact Person Name</label>
                        <input type="text" id="contactName" class="w-full bg-slate-50 border p-3 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold mb-2">WhatsApp Number *</label>
                        <input type="tel" id="contactWhatsApp" class="w-full bg-slate-50 border p-3 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold mb-2">Contact Email</label>
                        <input type="email" id="contactEmail" class="w-full bg-slate-50 border p-3 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold mb-2">Link (Web/Social)</label>
                        <input type="url" id="link" class="w-full bg-slate-50 border p-3 rounded-lg" placeholder="https://...">
                    </div>
                </div>

                <button id="submit-btn" class="mt-10 w-full bg-blue-800 text-white font-black py-4 rounded-xl shadow-lg hover:scale-[1.01] transition-transform uppercase tracking-widest">Submit Retreat</button>
                <p id="status" class="text-center mt-4 text-sm font-bold text-blue-600"></p>
            </div>

            <!-- GALLERY VIEW -->
            <div class="mt-12">
                <h3 class="text-2xl font-black mb-6 flex items-center gap-3">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-ping"></span>
                    Manage Your Retreats
                </h3>
                <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Cards appear here -->
                </div>
            </div>

        </div>
    </div>

    <!-- FIREBASE MODULES -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // CONFIGURATION: Replace these with your Project keys
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        let editingId = null;

        // POPULATE CATEGORIES
        const categories = ["Yoga & Breathwork", "Ayurveda & Traditional Healing", "Medical & Longevity", "Detox & Nutrition", "Sleep & Circadian Rhythm", "Physical Therapy", "Martial Arts & Movement", "Executive Leadership", "Tech & Agile", "Creative Industry", "Workations", "Sales & Networking", "Burnout Prevention", "Financial & Crypto", "Silent & Contemplative", "Energy & Sound", "Shadow Work & Psychology", "Religious & Pilgrimage", "Esoteric & Occult", "Philosophy & Ethics", "Writing & Literature", "Visual Arts", "Performing Arts", "Culinary Arts", "Handicrafts", "Film & Media", "High-Altitude & Trekking", "Water Sports", "Wilderness Survival", "Forest Bathing", "Extreme Sports", "Cycling & Overland", "Women's Circles", "Men's Brotherhood", "Couples & Intimacy", "Family & Kids", "LGBTQ+ Safe Spaces", "Senior/Silver Citizen", "Digital Detox", "Sustainability & Permaculture", "Minimalism", "Van-Life & Nomadic", "Animal-Assisted", "Astronomy & Stargazing", "Archaeology & History", "STEM & Coding", "Language Immersion"];
        const catList = document.getElementById('category-list');
        categories.forEach(cat => {
            catList.innerHTML += `
                <div class="flex items-center gap-2">
                    <input type="checkbox" name="category" value="${cat}" id="${cat}" class="w-4 h-4 rounded text-blue-600">
                    <label for="${cat}" class="text-xs text-slate-600 cursor-pointer">${cat}</label>
                </div>
            `;
        });

        // AUTH HANDLERS
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('login-prompt').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-display-email').innerText = user.email;
                loadData();
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('login-prompt').classList.remove('hidden');
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // FORM SUBMISSION (CREATE/UPDATE)
        document.getElementById('submit-btn').onclick = async () => {
            const status = document.getElementById('status');
            const file = document.getElementById('fileUpload').files[0];
            const checkedCats = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(cb => cb.value);

            status.innerText = "Syncing with Cloud Database...";

            try {
                let fileUrl = "";
                if (file) {
                    const sRef = ref(storage, 'retreats/' + Date.now() + "_" + file.name);
                    const snap = await uploadBytes(sRef, file);
                    fileUrl = await getDownloadURL(snap.ref);
                }

                const retreatData = {
                    retreatName: document.getElementById('retreatName').value,
                    state: document.getElementById('state').value,
                    city: document.getElementById('city').value,
                    startDate: document.getElementById('startDate').value,
                    startTime: document.getElementById('startTime').value,
                    endDate: document.getElementById('endDate').value,
                    endTime: document.getElementById('endTime').value,
                    categories: checkedCats,
                    description: document.getElementById('description').value,
                    contribution: document.getElementById('contribution').value,
                    orgInfo: document.getElementById('orgInfo').value,
                    contactName: document.getElementById('contactName').value,
                    contactWhatsApp: document.getElementById('contactWhatsApp').value,
                    contactEmail: document.getElementById('contactEmail').value,
                    link: document.getElementById('link').value,
                    fileUrl: fileUrl,
                    userEmail: auth.currentUser.email,
                    timestamp: Date.now()
                };

                if (editingId) {
                    await updateDoc(doc(db, "retreats", editingId), retreatData);
                    editingId = null;
                    document.getElementById('submit-btn').innerText = "Submit Retreat";
                } else {
                    await addDoc(collection(db, "retreats"), retreatData);
                }

                status.innerText = "Retreat Successfully Saved!";
                resetForm();
            } catch (err) {
                status.innerText = "Error: " + err.message;
            }
        };

        function resetForm() {
            document.querySelectorAll('input, select, textarea').forEach(el => el.value = "");
            document.querySelectorAll('input[type="checkbox"]').forEach(el => el.checked = false);
        }

        // LOAD DATA (GALLERY)
        function loadData() {
            const q = query(collection(db, "retreats"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = "";
                snapshot.forEach((snap) => {
                    const r = snap.data();
                    const id = snap.id;
                    const isOwner = auth.currentUser.email === r.userEmail;

                    gallery.innerHTML += `
                        <div class="bg-white p-6 rounded-xl border shadow-sm flex flex-col gap-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-black text-blue-900">${r.retreatName}</h4>
                                    <p class="text-xs text-slate-400">${r.city}, ${r.state}</p>
                                </div>
                                ${isOwner ? `<span class="bg-blue-50 text-blue-600 text-[10px] px-2 py-1 rounded font-bold uppercase">Your Post</span>` : ''}
                            </div>
                            <p class="text-sm line-clamp-2 text-slate-600">${r.description}</p>
                            <div class="flex flex-wrap gap-1">
                                ${r.categories.slice(0,3).map(c => `<span class="bg-slate-100 text-slate-500 text-[9px] px-2 py-0.5 rounded">${c}</span>`).join('')}
                                ${r.categories.length > 3 ? `<span class="text-[9px] text-slate-300">+${r.categories.length - 3} more</span>` : ''}
                            </div>
                            <div class="mt-4 pt-4 border-t flex justify-between items-center">
                                <a href="${r.fileUrl || '#'}" target="_blank" class="text-blue-600 text-xs font-bold underline ${r.fileUrl ? '' : 'hidden'}">View Attachment</a>
                                ${isOwner ? `
                                    <div class="flex gap-4">
                                        <button onclick="window.editRetreat('${id}')" class="text-xs text-slate-400 font-bold hover:text-blue-600">EDIT</button>
                                        <button onclick="window.deleteRetreat('${id}')" class="text-xs text-red-300 font-bold hover:text-red-600">DELETE</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            });
        }

        window.deleteRetreat = (id) => confirm("Permanently delete this retreat?") && deleteDoc(doc(db, "retreats", id));

        window.editRetreat = async (id) => {
            // Populate form logic
            alert("Loading retreat data for editing...");
            editingId = id;
            document.getElementById('submit-btn').innerText = "Update Retreat Info";
            window.scrollTo(0,0);
            // Note: For a full edit, you would pull the specific doc and set all field values here.
        };
    </script>
</body>
</html>
