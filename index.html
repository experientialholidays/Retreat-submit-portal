<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiential Holidays | Submit Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .form-section { background: white; border-radius: 16px; padding: 24px; border: 1px solid #e2e8f0; margin-bottom: 24px; }
        .input-label { block text-xs font-bold text-slate-500 uppercase mb-1.5; }
        .custom-input { width: 100%; background: #f8fafc; border: 2px solid #f1f5f9; padding: 12px; border-radius: 12px; outline: none; transition: all 0.2s; font-size: 14px; }
        .custom-input:focus { border-color: #3b82f6; background: white; }
        .category-chip { display: inline-block; padding: 2px 8px; background: #f1f5f9; border-radius: 12px; font-size: 10px; margin: 1px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <nav class="bg-blue-900 text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-[1200px] mx-auto flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-tighter uppercase">Experiential <span class="text-blue-400">Holidays</span></h1>
            <div id="auth-section" class="flex items-center gap-4">
                <button id="login-btn" class="bg-white text-blue-900 px-6 py-2 rounded-lg font-bold hover:bg-blue-50 transition">Sign In</button>
                <div id="user-profile" class="hidden flex items-center gap-4">
                    <a href="dashboard.html" class="text-sm font-bold bg-blue-700 px-4 py-2 rounded-lg hover:bg-blue-600 transition">My Dashboard</a>
                    <button id="logout-btn" class="text-xs font-bold text-blue-300 hover:text-white uppercase">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div id="main-content" class="hidden max-w-[1000px] mx-auto p-4 md:p-8 mt-4">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h2 id="form-title" class="text-3xl font-black text-slate-800 tracking-tight">Create Experience</h2>
                <p class="text-slate-500 font-medium">Fill in the details to publish your holiday experience.</p>
            </div>
            <a href="index.html" id="cancel-edit" class="hidden bg-red-50 text-red-600 px-4 py-2 rounded-lg text-xs font-bold uppercase hover:bg-red-100 transition">Discard Changes</a>
        </header>

        <input type="hidden" id="editingId">

        <div class="form-section">
            <h3 class="text-sm font-black text-blue-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center text-[10px]">01</span> Basic Details
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="input-label">Experience Title *</label>
                    <input type="text" id="retreatName" class="custom-input" placeholder="e.g., Himalayan Yoga Retreat" required>
                </div>
                <div>
                    <label class="input-label">State/UT *</label>
                    <select id="state" class="custom-input" required></select>
                </div>
                <div>
                    <label class="input-label">City *</label>
                    <input type="text" id="city" class="custom-input" placeholder="Enter city" required>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 class="text-sm font-black text-blue-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center text-[10px]">02</span> Classification
            </h3>
            <label class="input-label">Select Categories *</label>
            <div id="category-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 p-4 bg-slate-50 rounded-xl border-2 border-slate-100 h-48 overflow-y-auto"></div>
            <input type="text" id="otherCategory" class="hidden mt-3 custom-input border-blue-200" placeholder="Type your custom category here...">
        </div>

        <div class="form-section">
            <h3 class="text-sm font-black text-blue-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center text-[10px]">03</span> Schedule
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="input-label">Starts On *</label>
                    <div class="flex gap-2">
                        <input type="date" id="startDate" class="custom-input" required>
                        <input type="time" id="startTime" class="custom-input w-32">
                    </div>
                </div>
                <div>
                    <label class="input-label">Ends On *</label>
                    <div class="flex gap-2">
                        <input type="date" id="endDate" class="custom-input" required>
                        <input type="time" id="endTime" class="custom-input w-32">
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 class="text-sm font-black text-blue-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center text-[10px]">04</span> Detailed Information
            </h3>
            <div class="space-y-6">
                <div>
                    <label class="input-label">General Description *</label>
                    <textarea id="description" rows="4" class="custom-input" placeholder="Tell us about the experience..." required></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="input-label">Contribution / Price Details</label>
                        <textarea id="contribution" rows="2" class="custom-input" placeholder="Costs involved..."></textarea>
                    </div>
                    <div>
                        <label class="input-label">Inclusions & Exclusions</label>
                        <textarea id="inclusionsExclusions" rows="2" class="custom-input" placeholder="What is included..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 class="text-sm font-black text-blue-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center text-[10px]">05</span> Media & External Links
            </h3>
            <div class="space-y-6">
                <div>
                    <label class="input-label">Upload Media (Images, PDF, Video | Max 10 Files, 10MB each)</label>
                    <div id="file-upload-container" class="space-y-3">
                        <div class="flex items-center gap-2">
                            <input type="file" class="file-input-item w-full text-xs bg-slate-50 p-2 rounded-lg border border-dashed border-slate-300" accept="image/*,application/pdf,video/*">
                        </div>
                    </div>
                    <button type="button" id="add-file-btn" class="mt-3 text-blue-600 text-xs font-bold uppercase hover:text-blue-800 transition">+ Add Another File</button>
                </div>
                
                <div>
                    <label class="input-label">YouTube Video Link</label>
                    <input type="url" id="youtubeLink" class="custom-input" placeholder="https://youtube.com/watch?v=...">
                </div>

                <div>
                    <label class="input-label">Social Media & Web Links (Max 5)</label>
                    <div id="external-links-container" class="space-y-2">
                        <input type="url" class="external-link-input custom-input" placeholder="https://website-or-social-link.com">
                    </div>
                    <button type="button" id="add-link-btn" class="mt-2 text-blue-600 text-xs font-bold uppercase hover:text-blue-800 transition">+ Add Another Link</button>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3 class="text-sm font-black text-blue-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center text-[10px]">06</span> Contact Information
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="input-label">Organization Bio *</label>
                    <textarea id="orgInfo" rows="2" class="custom-input" placeholder="Briefly describe your organization..." required></textarea>
                </div>
                <div>
                    <label class="input-label">Contact Name *</label>
                    <input type="text" id="contactName" class="custom-input" placeholder="Full name" required>
                </div>
                <div>
                    <label class="input-label">WhatsApp Number *</label>
                    <div class="flex gap-2">
                        <input type="text" id="countryCode" class="w-20 custom-input text-center" value="+91">
                        <input type="tel" id="contactWhatsApp" class="flex-1 custom-input" placeholder="Phone number" required>
                    </div>
                </div>
                <div class="md:col-span-2">
                    <label class="input-label">Contact Email *</label>
                    <input type="email" id="orgContactEmail" class="custom-input" placeholder="email@organization.com" required>
                </div>
            </div>
        </div>

        <button id="submit-btn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-xl hover:bg-blue-700 shadow-xl shadow-blue-200 transition-all uppercase tracking-widest mb-10">
            Publish Experience
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2ipuHLEq40P-mkN0NaPvZVDrum4NoIs",
            authDomain: "submit-a.firebaseapp.com",
            projectId: "submit-a",
            storageBucket: "submit-a.firebasestorage.app",
            messagingSenderId: "488916289105",
            appId: "1:488916289105:web:ea80aae58690bd09465a70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        const ALL_CATEGORIES = ["Wellness & Healing", "Mental Health & Emotional Growth", "Spirituality & Consciousness", "Fitness, Movement & Martial Arts", "Adventure & Outdoor Exploration", "Nature, Sustainability & Eco Living", "Leadership, Business & Career", "Technology & Innovation", "Creativity & Arts", "Relationships & Connection", "Culture, Philosophy & Learning", "Lifestyle & Personal Transformation", "Luxury, Leisure & Travel", "Identity & Belonging", "Other"];
        const STATES = ["Andaman and Nicobar", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chandigarh", "Chhattisgarh", "D&N Haveli & Daman Diu", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "JK", "Jharkhand", "Karnataka", "Kerala", "Ladakh", "Lakshadweep", "MP", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Puducherry", "Punjab", "Rajasthan", "Sikkim", "TN", "Telangana", "Tripura", "UP", "Uttarakhand", "West Bengal"];

        // Init States
        const stateSelect = document.getElementById('state');
        STATES.forEach(s => stateSelect.innerHTML += `<option value="${s}">${s}</option>`);
        
        // Init Categories
        const catList = document.getElementById('category-list');
        ALL_CATEGORIES.forEach(c => {
            catList.innerHTML += `<label class="flex items-center gap-3 text-sm bg-white p-3 rounded-xl border border-slate-100 cursor-pointer hover:bg-blue-50 transition">
                <input type="checkbox" name="cat" value="${c}" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" onchange="window.toggleOtherInput(this)"> 
                <span class="text-slate-700 font-medium">${c}</span>
            </label>`;
        });

        window.toggleOtherInput = (cb) => {
            const otherInput = document.getElementById('otherCategory');
            if(cb.value === 'Other') {
                otherInput.classList.toggle('hidden', !cb.checked);
                if(cb.checked) otherInput.focus();
            }
        };

        // Dynamic File Uploads (Max 10)
        document.getElementById('add-file-btn').onclick = () => {
            const container = document.getElementById('file-upload-container');
            if (container.querySelectorAll('input[type="file"]').length < 10) {
                const div = document.createElement('div');
                div.className = "flex items-center gap-2 mt-2";
                div.innerHTML = `<input type="file" class="file-input-item w-full text-xs bg-slate-50 p-2 rounded-lg border border-dashed border-slate-300" accept="image/*,application/pdf,video/*">`;
                container.appendChild(div);
            } else {
                alert("Maximum 10 media files allowed.");
            }
        };

        // Dynamic Link Management (Max 5)
        document.getElementById('add-link-btn').onclick = () => {
            const container = document.getElementById('external-links-container');
            if (container.querySelectorAll('input').length < 5) {
                const input = document.createElement('input');
                input.type = 'url';
                input.className = 'external-link-input custom-input mt-2';
                input.placeholder = 'https://...';
                container.appendChild(input);
            } else {
                alert("Maximum 5 links allowed.");
            }
        };

        // Auth Listener
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                
                const urlParams = new URLSearchParams(window.location.search);
                const editId = urlParams.get('editId');
                if(editId) loadEditData(editId);
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-profile').classList.add('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        async function loadEditData(id) {
            const r = (await getDoc(doc(db, "retreats", id))).data();
            if(!r) return;
            document.getElementById('editingId').value = id;
            document.getElementById('retreatName').value = r.retreatName;
            document.getElementById('state').value = r.state;
            document.getElementById('city').value = r.city;
            document.getElementById('startDate').value = r.startDate;
            document.getElementById('endDate').value = r.endDate;
            document.getElementById('description').value = r.description;
            document.getElementById('contactName').value = r.contactName;
            document.getElementById('orgContactEmail').value = r.orgContactEmail;
            document.getElementById('form-title').innerText = "Update Experience";
            document.getElementById('cancel-edit').classList.remove('hidden');
            document.getElementById('submit-btn').innerText = "Save Changes";
        }

        // Submit Logic
        document.getElementById('submit-btn').onclick = async () => {
            const editId = document.getElementById('editingId').value;
            const btn = document.getElementById('submit-btn');
            
            if(!document.getElementById('retreatName').value || !document.getElementById('endDate').value) {
                alert("Please fill in Title and End Date."); return;
            }

            btn.innerText = "UPLOADING..."; btn.disabled = true;

            try {
                let fileUrls = [];
                const fileInputs = document.querySelectorAll('.file-input-item');
                
                for (let input of fileInputs) {
                    if (input.files[0]) {
                        const file = input.files[0];
                        if(file.size > 10 * 1024 * 1024) throw new Error("File " + file.name + " exceeds 10MB limit.");
                        const sRef = ref(storage, `retreats/${Date.now()}_${file.name}`);
                        const snap = await uploadBytes(sRef, file);
                        fileUrls.push(await getDownloadURL(snap.ref));
                    }
                }

                let selectedCats = Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(c => c.value);
                if(selectedCats.includes('Other')) {
                    const custom = document.getElementById('otherCategory').value;
                    if(custom) selectedCats.push(custom);
                    selectedCats = selectedCats.filter(c => c !== 'Other');
                }

                const data = {
                    retreatName: document.getElementById('retreatName').value,
                    hostEmail: auth.currentUser.email,
                    state: document.getElementById('state').value,
                    city: document.getElementById('city').value,
                    startDate: document.getElementById('startDate').value,
                    endDate: document.getElementById('endDate').value,
                    description: document.getElementById('description').value,
                    categories: selectedCats,
                    orgInfo: document.getElementById('orgInfo').value,
                    contactName: document.getElementById('contactName').value,
                    contactWhatsApp: document.getElementById('countryCode').value + document.getElementById('contactWhatsApp').value,
                    orgContactEmail: document.getElementById('orgContactEmail').value,
                    externalLinks: Array.from(document.querySelectorAll('.external-link-input')).map(i => i.value).filter(v => v !== ""),
                    timestamp: Date.now()
                };

                if(fileUrls.length > 0) data.fileUrls = fileUrls;
                if(editId) { await updateDoc(doc(db, "retreats", editId), data); window.location.href = "dashboard.html"; } 
                else { await addDoc(collection(db, "retreats"), data); window.location.reload(); }
            } catch (e) { alert(e.message); btn.innerText = "Publish Experience"; btn.disabled = false; }
        };
    </script>
</body>
    </html>
