<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiential Holidays | Manage Case</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .section-header { background-color: #f3f4f6; padding: 10px; font-weight: bold; margin-top: 20px; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-bold { font-weight: bold; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .add-btn { background: none; border: none; color: blue; font-weight: bold; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body class="bg-gray-100 p-4">

    <nav class="bg-blue-600 text-white p-4 mb-6 rounded shadow-lg">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold">Experiential Holidays</h1>
            <div id="auth-section" class="flex flex-col md:flex-row items-center gap-4">
                <button id="login-btn" class="bg-white text-blue-600 btn-bold">Login with Google</button>
                <div id="user-profile" class="hidden flex flex-col md:flex-row items-center gap-4">
                    <span id="user-email" class="font-bold"></span>
                    <button onclick="window.location.href='dashboard.html'" class="bg-yellow-400 text-black btn-bold">My Dashboard</button>
                    <button id="logout-btn" class="bg-red-500 text-white btn-bold">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div id="main-content" class="hidden max-w-4xl mx-auto bg-white p-8 rounded shadow">
        <h2 id="form-title" class="text-2xl font-bold mb-6 text-center">Submit New Experience</h2>
        <input type="hidden" id="editingId">

        <!-- BASIC DETAILS SECTION -->
        <div class="section-header">BASIC DETAILS</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div class="form-group md:col-span-2">
                <label>Experience Title *</label>
                <input type="text" id="retreatName" required>
            </div>
            <div class="form-group">
                <label>State/UT *</label>
                <select id="state" required></select>
            </div>
            <div class="form-group">
                <label>City (Nearest City) *</label>
                <input type="text" id="city" required>
            </div>
            <div class="form-group">
                <label>Start Date & Time *</label>
                <div class="flex gap-2">
                    <input type="date" id="startDate" required>
                    <input type="time" id="startTime">
                </div>
            </div>
            <div class="form-group">
                <label>End Date & Time *</label>
                <div class="flex gap-2">
                    <input type="date" id="endDate" required>
                    <input type="time" id="endTime">
                </div>
            </div>
        </div>

        <!-- EXPERIENCE DETAILS SECTION -->
        <div class="section-header">EXPERIENCE DETAILS</div>
        <div class="mt-4 space-y-4">
            <div class="form-group">
                <label>Pick Multiple Categories *</label>
                <div id="category-list" class="grid grid-cols-2 md:grid-cols-3 gap-2 border p-3 rounded bg-gray-50 h-40 overflow-y-auto"></div>
                <input type="text" id="otherCategory" class="hidden mt-2" placeholder="Enter custom category">
            </div>
            <div class="form-group">
                <label>General Description *</label>
                <textarea id="description" rows="4" required></textarea>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group">
                    <label>Contribution</label>
                    <textarea id="contribution" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Inclusions & Exclusions</label>
                    <textarea id="inclusionsExclusions" rows="3"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label>YouTube Link</label>
                <input type="url" id="youtubeLink" placeholder="https://youtube.com/watch?v=...">
            </div>
            <div class="form-group">
                <label>Media Upload (Max 5 files, 10MB each)</label>
                <input type="file" id="fileUpload" multiple accept="image/*,application/pdf,video/*">
                <div id="file-name-display" class="text-sm text-gray-600 mt-1"></div>
            </div>
        </div>

        <!-- CONTACT INFORMATION CENTER -->
        <div class="section-header">CONTACT INFORMATION CENTER</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div class="form-group md:col-span-2">
                <label>Organization Name (with brief Bio) *</label>
                <textarea id="orgInfo" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label>Contact Person Name *</label>
                <input type="text" id="contactName" required>
            </div>
            <div class="form-group">
                <label>Contact Email *</label>
                <input type="email" id="orgContactEmail" required>
            </div>
            <div class="form-group">
                <label>WhatsApp Number *</label>
                <div class="flex gap-2">
                    <input type="text" id="countryCode" value="+91" class="w-16 text-center">
                    <input type="tel" id="contactWhatsApp" required>
                </div>
            </div>
            <div class="form-group md:col-span-2">
                <label>External Links (Social Media, Web, etc. | Max 5)</label>
                <div id="external-links-container" class="space-y-2">
                    <input type="url" class="external-link-input" placeholder="https://">
                </div>
                <button type="button" id="add-link-btn" class="add-btn">+ Add another link</button>
            </div>
        </div>

        <button id="submit-btn" class="w-full bg-green-600 text-white btn-bold text-xl mt-8">Publish Experience</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2ipuHLEq40P-mkN0NaPvZVDrum4NoIs",
            authDomain: "submit-a.firebaseapp.com",
            projectId: "submit-a",
            storageBucket: "submit-a.firebasestorage.app",
            messagingSenderId: "488916289105",
            appId: "1:488916289105:web:ea80aae58690bd09465a70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        const ALL_CATEGORIES = ["Wellness & Healing", "Mental Health & Emotional Growth", "Spirituality & Consciousness", "Fitness, Movement & Martial Arts", "Adventure & Outdoor Exploration", "Nature, Sustainability & Eco Living", "Leadership, Business & Career", "Technology & Innovation", "Creativity & Arts", "Relationships & Connection", "Culture, Philosophy & Learning", "Lifestyle & Personal Transformation", "Luxury, Leisure & Travel", "Identity & Belonging", "Other"];
        const STATES = ["Andaman and Nicobar", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chandigarh", "Chhattisgarh", "D&N Haveli & Daman Diu", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "JK", "Jharkhand", "Karnataka", "Kerala", "Ladakh", "Lakshadweep", "MP", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Puducherry", "Punjab", "Rajasthan", "Sikkim", "TN", "Telangana", "Tripura", "UP", "Uttarakhand", "West Bengal"];

        const stateSelect = document.getElementById('state');
        STATES.forEach(s => stateSelect.innerHTML += `<option value="${s}">${s}</option>`);
        
        const catList = document.getElementById('category-list');
        ALL_CATEGORIES.forEach(c => {
            catList.innerHTML += `<label class="flex items-center gap-2 text-sm"><input type="checkbox" name="cat" value="${c}" onchange="window.toggleOther(this)"> ${c}</label>`;
        });

        window.toggleOther = (cb) => {
            if(cb.value === 'Other') document.getElementById('otherCategory').classList.toggle('hidden', !cb.checked);
        };

        document.getElementById('add-link-btn').onclick = () => {
            const container = document.getElementById('external-links-container');
            if (container.querySelectorAll('input').length < 5) {
                const input = document.createElement('input');
                input.type = 'url';
                input.className = 'external-link-input mt-2';
                input.placeholder = 'https://';
                container.appendChild(input);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                const urlParams = new URLSearchParams(window.location.search);
                const editId = urlParams.get('editId');
                if(editId) loadEditData(editId);
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-profile').classList.add('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        async function loadEditData(id) {
            const r = (await getDoc(doc(db, "retreats", id))).data();
            if(!r) return;
            document.getElementById('editingId').value = id;
            document.getElementById('retreatName').value = r.retreatName;
            document.getElementById('state').value = r.state;
            document.getElementById('city').value = r.city;
            document.getElementById('startDate').value = r.startDate;
            document.getElementById('endDate').value = r.endDate;
            document.getElementById('description').value = r.description;
            document.getElementById('form-title').innerText = "Edit Experience";
            document.getElementById('submit-btn').innerText = "Update Experience";
        }

        document.getElementById('submit-btn').onclick = async () => {
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Processing..."; btn.disabled = true;
            try {
                let fileUrls = [];
                const files = document.getElementById('fileUpload').files;
                for (let f of files) {
                    const sRef = ref(storage, `retreats/${Date.now()}_${f.name}`);
                    const snap = await uploadBytes(sRef, f);
                    fileUrls.push(await getDownloadURL(snap.ref));
                }
                const data = {
                    retreatName: document.getElementById('retreatName').value,
                    hostEmail: auth.currentUser.email,
                    state: document.getElementById('state').value,
                    city: document.getElementById('city').value,
                    startDate: document.getElementById('startDate').value,
                    startTime: document.getElementById('startTime').value,
                    endDate: document.getElementById('endDate').value,
                    endTime: document.getElementById('endTime').value,
                    description: document.getElementById('description').value,
                    categories: Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(c => c.value),
                    contribution: document.getElementById('contribution').value,
                    inclusionsExclusions: document.getElementById('inclusionsExclusions').value,
                    youtubeLink: document.getElementById('youtubeLink').value,
                    orgInfo: document.getElementById('orgInfo').value,
                    contactName: document.getElementById('contactName').value,
                    contactWhatsApp: document.getElementById('countryCode').value + document.getElementById('contactWhatsApp').value,
                    orgContactEmail: document.getElementById('orgContactEmail').value,
                    externalLinks: Array.from(document.querySelectorAll('.external-link-input')).map(i => i.value).filter(v => v !== ""),
                    timestamp: Date.now()
                };
                if(fileUrls.length > 0) data.fileUrls = fileUrls;
                const editId = document.getElementById('editingId').value;
                if(editId) await updateDoc(doc(db, "retreats", editId), data);
                else await addDoc(collection(db, "retreats"), data);
                window.location.href = "dashboard.html";
            } catch (e) { alert(e.message); btn.innerText = "Publish Experience"; btn.disabled = false; }
        };
    </script>
</body>
</html>
