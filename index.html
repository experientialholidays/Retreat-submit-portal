<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiential Holidays | Submit Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .category-chip { display: inline-block; padding: 2px 8px; background: #f1f5f9; border-radius: 12px; font-size: 10px; margin: 1px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-blue-900 text-white p-4 sticky top-0 z-50">
        <div class="max-w-[1800px] mx-auto flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-tighter uppercase">Experiential <span class="text-blue-400">Holidays</span></h1>
            <div id="auth-section" class="flex items-center gap-6">
                <button id="login-btn" class="bg-white text-blue-900 px-6 py-2 rounded-lg font-bold">Sign In with Google</button>
                <div id="user-profile" class="hidden flex items-center gap-4">
                    <span id="user-email" class="text-sm border-r border-blue-700 pr-4"></span>
                    <a href="dashboard.html" class="text-sm font-bold bg-blue-700 px-4 py-2 rounded hover:bg-blue-600 transition">View Dashboard</a>
                    <button id="logout-btn" class="text-xs font-bold text-blue-300 hover:text-white uppercase">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div id="main-content" class="hidden max-w-[1200px] mx-auto p-6 space-y-8">
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-6">
                <h2 id="form-title" class="text-2xl font-black text-slate-800">Add New Experience</h2>
                <a href="index.html" id="cancel-edit" class="hidden bg-slate-100 text-slate-500 px-4 py-2 rounded-lg text-xs font-bold uppercase">Discard Edit</a>
            </div>
            
            <input type="hidden" id="editingId">
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Experience Title *</label>
                    <input type="text" id="retreatName" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl outline-none focus:border-blue-500 transition" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">State/UT *</label>
                    <select id="state" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl outline-none" required></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">City *</label>
                    <input type="text" id="city" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl outline-none" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Start Date & Time *</label>
                    <div class="flex gap-2">
                        <input type="date" id="startDate" class="w-full bg-slate-50 border-2 border-slate-100 p-2 rounded-lg text-sm" required>
                        <input type="time" id="startTime" class="w-full bg-slate-50 border-2 border-slate-100 p-2 rounded-lg text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">End Date & Time *</label>
                    <div class="flex gap-2">
                        <input type="date" id="endDate" class="w-full bg-slate-50 border-2 border-slate-100 p-2 rounded-lg text-sm" required>
                        <input type="time" id="endTime" class="w-full bg-slate-50 border-2 border-slate-100 p-2 rounded-lg text-sm">
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Select Categories *</label>
                    <div id="category-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 p-3 bg-slate-50 rounded-xl border-2 border-slate-100 h-48 overflow-y-auto"></div>
                    <input type="text" id="otherCategory" class="hidden mt-2 w-full bg-white border-2 border-blue-100 p-2 rounded-lg text-sm outline-none" placeholder="Write your category...">
                </div>

                <div class="md:col-span-4 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">General Description *</label>
                        <textarea id="description" rows="4" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl text-sm" required></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Contribution</label>
                        <textarea id="contribution" rows="2" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Inclusions & Exclusions</label>
                        <textarea id="inclusionsExclusions" rows="2" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl text-sm"></textarea>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">YouTube Link</label>
                    <input type="url" id="youtubeLink" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl outline-none" placeholder="https://youtube.com/watch?v=...">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Upload (Images, PDF, Video | Max 5 files, 10MB each)</label>
                    <input type="file" id="fileUpload" multiple accept="image/*,application/pdf,video/*" class="w-full p-2 bg-slate-100 rounded-xl text-xs">
                    <div id="file-name-display" class="mt-2 flex flex-wrap gap-2"></div>
                </div>

                <div class="md:col-span-4 grid grid-cols-1 md:grid-cols-4 gap-4 pt-4 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Organization Bio *</label>
                        <textarea id="orgInfo" rows="2" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl text-sm" required></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Contact Name *</label>
                        <input type="text" id="contactName" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl outline-none" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">WhatsApp Number *</label>
                        <div class="flex gap-2">
                            <input type="text" id="countryCode" class="w-16 bg-slate-50 border-2 border-slate-100 p-3 rounded-xl outline-none" value="+91">
                            <input type="tel" id="contactWhatsApp" class="flex-1 bg-slate-50 border-2 border-slate-100 p-3 rounded-xl outline-none" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Contact Email *</label>
                        <input type="email" id="orgContactEmail" class="w-full bg-slate-50 border-2 border-slate-100 p-3 rounded-xl outline-none" required>
                    </div>
                </div>

                <div class="md:col-span-4 pt-4 border-t border-slate-100">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">External Links (Social Media, Web, etc. | Max 5)</label>
                    <div id="external-links-container" class="space-y-2">
                        <input type="url" class="external-link-input w-full bg-slate-50 border-2 border-slate-100 p-2 rounded-lg text-sm outline-none focus:border-blue-300" placeholder="https://...">
                    </div>
                    <button type="button" id="add-link-btn" class="mt-2 text-blue-600 text-xs font-bold uppercase hover:underline">+ Add another link</button>
                </div>
            </div>

            <button id="submit-btn" class="mt-8 bg-blue-600 text-white w-full py-4 rounded-xl font-bold text-lg hover:bg-blue-700 shadow-lg transition-all uppercase tracking-widest">Submit Experience</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAY2ipuHLEq40P-mkN0NaPvZVDrum4NoIs",
            authDomain: "submit-a.firebaseapp.com",
            projectId: "submit-a",
            storageBucket: "submit-a.firebasestorage.app",
            messagingSenderId: "488916289105",
            appId: "1:488916289105:web:ea80aae58690bd09465a70"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        const ALL_CATEGORIES = ["Wellness & Healing", "Mental Health & Emotional Growth", "Spirituality & Consciousness", "Fitness, Movement & Martial Arts", "Adventure & Outdoor Exploration", "Nature, Sustainability & Eco Living", "Leadership, Business & Career", "Technology & Innovation", "Creativity & Arts", "Relationships & Connection", "Culture, Philosophy & Learning", "Lifestyle & Personal Transformation", "Luxury, Leisure & Travel", "Identity & Belonging", "Other"];
        const STATES = ["Andaman and Nicobar", "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chandigarh", "Chhattisgarh", "D&N Haveli & Daman Diu", "Delhi", "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "JK", "Jharkhand", "Karnataka", "Kerala", "Ladakh", "Lakshadweep", "MP", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Puducherry", "Punjab", "Rajasthan", "Sikkim", "TN", "Telangana", "Tripura", "UP", "Uttarakhand", "West Bengal"];

        // UI Prep
        const stateSelect = document.getElementById('state');
        STATES.forEach(s => stateSelect.innerHTML += `<option value="${s}">${s}</option>`);
        
        const catList = document.getElementById('category-list');
        ALL_CATEGORIES.forEach(c => {
            catList.innerHTML += `<label class="flex items-center gap-2 text-xs bg-white p-2 rounded-lg border border-slate-200 cursor-pointer hover:bg-blue-50">
                <input type="checkbox" name="cat" value="${c}" class="rounded" onchange="window.toggleOtherInput(this)"> ${c}
            </label>`;
        });

        window.toggleOtherInput = (cb) => {
            const otherInput = document.getElementById('otherCategory');
            if(cb.value === 'Other') {
                otherInput.classList.toggle('hidden', !cb.checked);
                if(cb.checked) otherInput.focus();
            }
        };

        // Link Management
        document.getElementById('add-link-btn').onclick = () => {
            const container = document.getElementById('external-links-container');
            if (container.querySelectorAll('input').length < 5) {
                const input = document.createElement('input');
                input.type = 'url';
                input.className = 'external-link-input w-full bg-slate-50 border-2 border-slate-100 p-2 rounded-lg text-sm outline-none focus:border-blue-300';
                input.placeholder = 'https://...';
                container.appendChild(input);
            } else {
                alert("Maximum 5 links allowed.");
            }
        };

        // File Selection
        document.getElementById('fileUpload').onchange = function() {
            const display = document.getElementById('file-name-display');
            display.innerHTML = "";
            if(this.files.length > 5) { alert("Max 5 files."); this.value = ""; return; }
            for(let f of this.files) {
                if(f.size > 10 * 1024 * 1024) { alert(f.name + " exceeds 10MB."); this.value = ""; display.innerHTML = ""; return; }
                display.innerHTML += `<span class="bg-blue-100 text-blue-700 text-[10px] px-2 py-1 rounded-md font-semibold">${f.name}</span>`;
            }
        };

        // Auth
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;
                
                // Check if we are editing an existing item from the dashboard
                const urlParams = new URLSearchParams(window.location.search);
                const editId = urlParams.get('editId');
                if(editId) {
                    loadEditData(editId);
                }
            } else {
                document.getElementById('login-btn').classList.remove('hidden');
                document.getElementById('user-profile').classList.add('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider).catch(err => alert("Login Error: " + err.message));
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // Load Edit Data Logic
        async function loadEditData(id) {
            try {
                const r = (await getDoc(doc(db, "retreats", id))).data();
                if(!r) return;

                document.getElementById('editingId').value = id;
                document.getElementById('retreatName').value = r.retreatName;
                document.getElementById('state').value = r.state;
                document.getElementById('city').value = r.city;
                document.getElementById('startDate').value = r.startDate;
                document.getElementById('endDate').value = r.endDate;
                document.getElementById('description').value = r.description;
                document.getElementById('contactName').value = r.contactName;
                document.getElementById('orgContactEmail').value = r.orgContactEmail;
                
                const container = document.getElementById('external-links-container');
                container.innerHTML = "";
                (r.externalLinks || [""]).forEach(link => {
                    const input = document.createElement('input');
                    input.type = 'url';
                    input.className = 'external-link-input w-full bg-slate-50 border-2 border-slate-100 p-2 rounded-lg text-sm outline-none';
                    input.value = link;
                    container.appendChild(input);
                });

                document.getElementById('form-title').innerText = "Editing: " + r.retreatName;
                document.getElementById('cancel-edit').classList.remove('hidden');
                document.getElementById('submit-btn').innerText = "Update Experience";
            } catch(e) {
                console.error("Could not load edit data:", e);
            }
        }

        // Submit Logic
        document.getElementById('submit-btn').onclick = async () => {
            const editId = document.getElementById('editingId').value;
            const btn = document.getElementById('submit-btn');
            
            if(!document.getElementById('retreatName').value || !document.getElementById('endDate').value) {
                alert("Experience Title and End Date are required."); return;
            }

            btn.innerText = "UPLOADING..."; btn.disabled = true;

            try {
                let fileUrls = [];
                const files = document.getElementById('fileUpload').files;
                for (let f of files) {
                    const sRef = ref(storage, `retreats/${Date.now()}_${f.name}`);
                    const snap = await uploadBytes(sRef, f);
                    fileUrls.push(await getDownloadURL(snap.ref));
                }

                let selectedCats = Array.from(document.querySelectorAll('input[name="cat"]:checked')).map(c => c.value);
                if(selectedCats.includes('Other')) {
                    const custom = document.getElementById('otherCategory').value;
                    if(custom) selectedCats.push(custom);
                    selectedCats = selectedCats.filter(c => c !== 'Other');
                }

                const externalLinks = Array.from(document.querySelectorAll('.external-link-input')).map(i => i.value).filter(v => v !== "");

                const data = {
                    retreatName: document.getElementById('retreatName').value,
                    hostEmail: auth.currentUser.email,
                    state: document.getElementById('state').value,
                    city: document.getElementById('city').value,
                    startDate: document.getElementById('startDate').value,
                    startTime: document.getElementById('startTime').value,
                    endDate: document.getElementById('endDate').value,
                    endTime: document.getElementById('endTime').value,
                    description: document.getElementById('description').value,
                    categories: selectedCats,
                    contribution: document.getElementById('contribution').value,
                    inclusionsExclusions: document.getElementById('inclusionsExclusions').value,
                    youtubeLink: document.getElementById('youtubeLink').value,
                    orgInfo: document.getElementById('orgInfo').value,
                    contactName: document.getElementById('contactName').value,
                    contactWhatsApp: document.getElementById('countryCode').value + document.getElementById('contactWhatsApp').value,
                    orgContactEmail: document.getElementById('orgContactEmail').value,
                    externalLinks: externalLinks,
                    timestamp: Date.now()
                };

                if(fileUrls.length > 0) data.fileUrls = fileUrls;
                
                if(editId) {
                    await updateDoc(doc(db, "retreats", editId), data);
                    alert("Experience updated successfully!");
                    window.location.href = "dashboard.html"; // Go back to dashboard after edit
                } else {
                    await addDoc(collection(db, "retreats"), data);
                    alert("Experience submitted successfully!");
                    window.location.reload();
                }
            } catch (e) { 
                alert("Error: " + e.message); 
                btn.innerText = "Submit Experience"; 
                btn.disabled = false; 
            }
        };
    </script>
</body>
</html>
